      unit: ""
      source: 2022 EFSUMB Head/Neck Training [8]; 2023 AIUM Thyroid/Head-Neck Practice Parameter [2]
      gradations:
      - name: Нормальная (гилус + кортикальный слой)
      - name: Диффузно гипоэхогенная (воспаление, лимфома)
      - name: Неоднородная (некроз, метастазы)
      - name: С обширной зоной некроза (метастаз плоскоклеточного рака)

    - id: ln_vascularity
