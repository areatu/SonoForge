      unit: мм
      norm_male: {high: 8}
      norm_female: {high: 8}
      pathology_desc: "Short-axis >8 мм (шейные), >10 мм (паховые), >11 мм (подмышечные) — патологическое увеличение"
      source: 2023 AIUM Thyroid/Head-Neck Practice Parameter [2]; 2022 EFSUMB Head/Neck Training [8]; AJCC 8th ed.
      gradations:
      - name: Норма
        range_male: {high: 8}
        range_female: {high: 8}
      - name: Увеличение (подозрительные)
        range_male: {low: 8, high: 10}
        range_female: {low: 8, high: 10}
      - name: Патологическое увеличение
        range_male: {low: 10}
        range_female: {low: 10}

    - id: ln_sla_sa_ratio
      name: Соотношение S/L (short/long axis)
      full_name: Отношение короткой оси к длинной оси лимфоузла (>0.5 — патологическое)
      unit: ""
      norm_male: {high: 0.5}
      norm_female: {high: 0.5}
      pathology_desc: "S/L ratio >0.5 — овальная форма (подозрительно); >1.0 — шаровидная форма"
      source: 2022 EFSUMB Head/Neck Training [8]; Defined by Expert Consensus [15]
      gradations:
      - name: Норма (овальный, S/L <0.5)
        range_male: {high: 0.5}
        range_female: {high: 0.5}
      - name: Подозрительный (S/L 0.5–1.0)
        range_male: {low: 0.5, high: 1.0}
        range_female: {low: 0.5, high: 1.0}
      - name: Критический (шаровидный, S/L >1.0)
        range_male: {low: 1.0}
        range_female: {low: 1.0}

    - id: ln_cortex_width
      name: Толщина кортикального слоя
      full_name: Толщина кортикального слоя лимфоузла
      unit: мм
      norm_male: {high: 3}
      norm_female: {high: 3}
      pathology_desc: ">3 мм — утолщение кортикального слоя (признак метастатического поражения)"
      source: 2022 EFSUMB Head/Neck Training [8]; Defined by Expert Consensus [15]

