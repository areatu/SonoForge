<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочник по ЭхоКГ и УЗИ</title>
    <style>body{background:#102135}</style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <span class="app-icon">📋</span>
            <h1>Справочник по ЭхоКГ и УЗИ</h1>
        </div>
        <div class="header-right">
            <div class="age-filter" id="ageFilter">
                <label class="age-label" for="ageInput">Age:</label>
                <input type="number" id="ageInput" class="age-input" placeholder="—" min="0" max="120">
                <span class="age-unit">y</span>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
                <div class="search-results" id="searchResults" hidden></div>
            </div>
            <button class="edit-toggle" id="editToggle" title="Edit mode">✏️ Edit</button>
            <div class="edit-actions" id="editActions" hidden>
                <button class="save-btn" id="saveBtn">💾 Save</button>
                <button class="cancel-btn" id="cancelBtn">✕ Cancel</button>
                <span class="edit-status" id="editStatus"></span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- Left: Topics -->
        <section class="panel panel-left" id="panelTopics">
            <div class="panel-header">
                <h2 id="topicsHeader">Anatomy</h2>
            </div>
            <div class="panel-body" id="topicsList"></div>
            <div class="panel-stats" id="statsBar">
                <span id="statsText"></span>
            </div>
        </section>

        <div class="resize-handle"></div>

        <!-- Right: Content -->
        <section class="panel panel-right" id="panelContent">
            <!-- Pathology tabs -->
            <div class="pathology-bar" id="pathologyBar">
                <div class="empty-hint" id="pathoHint">Select a topic on the left</div>
            </div>

            <!-- Description panel -->
            <div class="desc-panel" id="descPanel" hidden>
                <div class="desc-icon">ℹ️</div>
                <div class="desc-text" id="descText"></div>
            </div>

            <!-- Main content split: params + images -->
            <div class="content-split">
                <!-- Left: Parameters table -->
                <div class="content-params">
                    <div class="params-area" id="paramsArea" hidden>
                        <div class="table-scroll">
                            <table class="param-table" id="paramTable">
                                <thead id="paramHead"></thead>
                                <tbody id="paramBody"></tbody>
                            </table>
                        </div>
                        <div class="source-bar" id="sourceBar" hidden></div>
                    </div>
                </div>

                <!-- Right: Image gallery -->
                <div class="content-images">
                    <div class="image-gallery" id="imageGallery">
                        <div class="empty-state" id="imageEmpty">
                            <span class="empty-icon">🖼</span>
                            <p id="imageEmptyText">No images</p>
                        </div>
                        <div class="image-main" id="imageMain" hidden>
                            <img id="mainImage" alt="">
                        </div>
                        <div class="image-thumbs" id="imageThumbs" hidden></div>
                        <div class="image-nav" id="imageNav" hidden>
                            <button class="nav-btn" id="btnImgPrev">◀</button>
                            <span class="image-counter" id="imageCounter">0 / 0</span>
                            <button class="nav-btn" id="btnImgNext">▶</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip" hidden></div>

    <!-- Image lightbox modal -->
    <div class="image-modal" id="imageModal" hidden>
        <div class="modal-toolbar">
            <button class="nav-btn" id="modalPrev" title="Previous">◀</button>
            <span class="image-counter" id="modalCounter"></span>
            <button class="nav-btn" id="modalNext" title="Next">▶</button>
            <button class="modal-close" id="modalClose" title="Close (Esc)">✕</button>
        </div>
        <img id="modalImage" alt="">
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="bridge.js"></script>
    <script src="script.js"></script>
</body>
</html>
