# Педиатрические и фетальные нормативы (план А.12, issue #650).
#
# ЭТА ТАБЛИЦА — НАЧАЛЬНЫЕ ЗНАЧЕНИЯ (SEED): приблизительные средние/SD по
# диапазонам, каждая запись помечена verified: false. Это стартовая точка
# для врача, а НЕ цитата из первоисточника. Значения редактируются прямо
# здесь: диапазоны (bands) — линейная интерполяция между опорными точками.
#
# Формат:
#   kind: bsa_bands    — педиатрия, опоры по площади поверхности тела (BSA, м²);
#   kind: ga_bands     — фетальная ЭхоКГ, опоры по сроку гестации (недели).
#   bsa / weeks — опора; mean — ожидаемое среднее; sd — стандартное отклонение.
# Вне диапазона опор Z-score не считается (экстраполяция запрещена).
