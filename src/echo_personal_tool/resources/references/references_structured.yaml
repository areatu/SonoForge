        range_male: {high: 125}
        range_female: {high: 125}
      - name: Стеноз 50–69%
        range_male: {low: 125, high: 230}
        range_female: {low: 125, high: 230}
      - name: Стеноз 70–99%
        range_male: {low: 230, high: 400}
        range_female: {low: 230, high: 400}
      - name: Окклюзия
        range_male: {low: 0, high: 0}
        range_female: {low: 0, high: 0}
    - id: ica_edv
      name: КДВ ВСА (ICA EDV)
      full_name: Конечно-диастолическая скорость кровотока во внутренней сонной артерии
      unit: см/с
      norm_male: {high: 40}
      norm_female: {high: 40}
      pathology_desc: EDV >40 см/с — стеноз ≥50%; >100 см/с — стеноз ≥70%
      source: 2024 ESVS Guidelines; 2021 AIUM Extracranial Cerebrovascular Practice
        Parameter
      gradations:
      - name: Норма
        range_male: {high: 40}
        range_female: {high: 40}
      - name: Стеноз 50–69%
        range_male: {low: 40, high: 100}
        range_female: {low: 40, high: 100}
      - name: Стеноз 70–99%
        range_male: {low: 100, high: 150}
        range_female: {low: 100, high: 150}
      - name: Окклюзия
        range_male: {low: 150}
        range_female: {low: 150}
    - id: ica_cca_ratio
      name: Соотношение PSV ВСА/ОСА (ICA/CCA ratio)
      full_name: Отношение пиковой систолической скорости внутренней сонной артерии
        к общей сонной артерии
      norm_male: {high: 2.0}
      norm_female: {high: 2.0}
      pathology_desc: Ratio >2.0 — стеноз ≥50%; >4.0 — стеноз ≥70%
      source: 2024 ESVS Guidelines; 2021 AIUM Extracranial Cerebrovascular Practice
        Parameter
      gradations:
      - name: Норма
        range_male: {high: 2.0}
        range_female: {high: 2.0}
      - name: Стеноз 50–69%
        range_male: {low: 2.0, high: 4.0}
        range_female: {low: 2.0, high: 4.0}
      - name: Стеноз ≥70%
        range_male: {low: 4.0}
        range_female: {low: 4.0}
  - name: Диаметр сонной артерии
    slug: carotid_diameter
    description: Диаметр общей и внутренней сонной артерии
    parameters:
    - id: cca_diameter
      name: Диаметр ОСА
      full_name: Диаметр общей сонной артерии в диастолу
      unit: мм
      norm_male: {low: 6.0, high: 8.0}
      norm_female: {low: 5.5, high: 7.0}
      pathology_desc: Диаметр >8.0 мм (муж.) / >7.0 мм (жен.) — дилатация; >10 мм
        — аневризма
      source: 2021 AIUM Extracranial Cerebrovascular Practice Parameter [1]
      gradations:
      - name: Норма
        range_male: {low: 6.0, high: 8.0}
        range_female: {low: 5.5, high: 7.0}
      - name: Дилатация
        range_male: {low: 8.0, high: 10.0}
        range_female: {low: 7.0, high: 10.0}
      - name: Аневризма
        range_male: {low: 10.0}
        range_female: {low: 10.0}
    - id: ica_diameter
      name: Диаметр ВСА
      full_name: Диаметр внутренней сонной артерии (проксимальный сегмент)
      unit: мм
      norm_male: {low: 4.0, high: 6.5}
      norm_female: {low: 3.5, high: 6.0}
      source: 2021 AIUM Extracranial Cerebrovascular Practice Parameter [1]
