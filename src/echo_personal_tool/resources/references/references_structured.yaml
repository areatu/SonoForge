        high: -18
      norm_female:
        low: -20
        high: -18
      pathology_desc: '>-18 (менее отриц.) — нарушение'
      source: 2015, ASE, Guidelines for the Standardization in Echocardiography
    - id: lvef3d
      name: Фракция выброса 3D (LVEF 3D)
      unit: '%'
      norm_male:
        low: 52
        high: 72
      norm_female:
        low: 54
        high: 74
      pathology_desc: <52 (м) / <54 (ж) — снижение
