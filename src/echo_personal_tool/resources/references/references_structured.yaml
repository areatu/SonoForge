    - LV_geometry2.png
    parameters:
    - id: lvmi_hyp
      name: Индекс массы миокарда (LVMI)
      unit: г/м²
      norm_male:
        low: 49
        high: 115
      norm_female:
        low: 43
        high: 95
      pathology_desc: '>115 (м) / >95 (ж) — гипертрофия'
      source: 2021, ESC/EACTS, 2021 ESC/EACTS Guidelines for the Management of Valvular
        Heart Disease
    - id: rwt_hyp
      name: Относительная толщина стенок (RWT)
      norm_male:
        low: 0.32
        high: 0.42
      norm_female:
        low: 0.32
        high: 0.42
      pathology_desc: '>0.42 — концентрическая; <0.32 — эксцентрическая'
      source: 2015, ASE, Guidelines for the Standardization in Echocardiography
      unit: ''
    - id: lvpwd_hyp
      name: Толщина задней стенки (LVPWd)
      unit: мм
      norm_male:
        low: 6
        high: 11
      norm_female:
        low: 6
        high: 10
      pathology_desc: '>11 — гипертрофия'
      source: 2015, ASE, Guidelines for the Standardization in Echocardiography
