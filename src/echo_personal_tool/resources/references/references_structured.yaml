        range_male: {low: 50, high: 69}
        range_female: {low: 50, high: 69}
      - name: Выраженный (70–99%)
        range_male: {low: 70, high: 99}
        range_female: {low: 70, high: 99}
      - name: Окклюзия
        range_male: {low: 100}
        range_female: {low: 100}
    - id: ica_peak_systolic_velocity
      name: ПСВ ВСА (ICA PSV)
      full_name: Пиковая систолическая скорость кровотока во внутренней сонной артерии
      unit: см/с
      norm_male: {high: 125}
      norm_female: {high: 125}
      pathology_desc: PSV >125 см/с — подозрение на стеноз ≥50%; >230 см/с — стеноз
        ≥70%
      source: 2024 ESVS Guidelines; 2021 AIUM Extracranial Cerebrovascular Practice
        Parameter
      gradations:
