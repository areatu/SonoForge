      gradations:
      - {name: Нормальная васкуляризация}
      - {name: Сниженная}
      - {name: Повышенная (thyroid inferno — тиреотоксикоз)}
      - {name: Абсолютное отсутствие кровотока}
  - name: Узловые образования щитовидной железы
    slug: thyroid_nodules
    description: Классификация узловых образований по ACR TI-RADS и EU-TIRADS
    parameters:
    - id: nodule_composition
      name: Состав узла (ACR TI-RADS)
      full_name: Состав (scripción) узлового образования по ACR TI-RADS
      source: 2017, ACR TI-RADS, Tessler et al., JACR 2017;14(5):587-595 [11]
      gradations:
      - {name: Полностью жидкостный (0 баллов)}
      - {name: Смешанный成分 (микрокальцинаты) (1 балл)}
      - {name: Смешанный компонент (суспензия) (2 балла)}
      - {name: Солидный или почти солидный (3 балла)}
      - {name: Очень гипоэхогенный (4 балла)}
    - id: nodule_echostructure
      name: Эхогенность узла (ACR TI-RADS)
      full_name: Эхогенность узлового образования по ACR TI-RADS
      source: 2017, ACR TI-RADS [11]; 2016 ATA Guidelines [10]
      gradations:
      - {name: Анаэхогенный (0 баллов)}
      - {name: Гиперэхогенный (1 балл)}
      - {name: Изоэхогенный (2 балла)}
      - {name: Гипоэхогенный (3 балла)}
      - {name: Очень гипоэхогенный (4 балла)}
    - id: nodule_margins
      name: Форма и контуры узла (ACR TI-RADS)
      full_name: Форма, контуры и края узлового образования по ACR TI-RADS
      source: 2017, ACR TI-RADS [11]
      gradations:
      - {name: 'Округлый/овальный, гладкие контуры (0 баллов)'}
      - {name: 'Вытянутый (<высоты), гладкие (0 баллов)'}
      - {name: Неправильные контуры (2 балла)}
      - {name: Зубчатые контуры (3 балла)}
      - {name: Экстракапсулярное распространение (3 балла)}
    - id: nodule_calcifications
      name: Кальцинаты узла (ACR TI-RADS)
      full_name: Тип кальцинатов в узловом образовании по ACR TI-RADS
      source: 2017, ACR TI-RADS [11]
      gradations:
      - {name: Отсутствуют (0 баллов)}
      - {name: Грубые (крупные) кальцинаты (1 балл)}
      - {name: Микрокальцинаты (3 балла)}
      - {name: Микрокальцинаты + экстракапсулярное распространение (3 балла)}
    - id: nodule_height_width_ratio
      name: Соотношение высота/ширина (taller-than-wide)
      full_name: Соотношение передне-задний размер к медиолатеральному (>1 — taller-than-wide)
      source: 2017, ACR TI-RADS [11]; 2016 ATA Guidelines [10]
      gradations:
      - {name: 'Шире, чем высокий (0 баллов)'}
      - {name: 'Выше, чем широкий (3 балла)'}
    - id: nodule_tirads_category
      name: Категория ACR TI-RADS
      full_name: Итоговая категория узлового образования по ACR TI-RADS
      source: 2017, ACR TI-RADS [11]
      gradations:
      - {name: TR1 — Доброкачественный (0 баллов)}
      - {name: TR2 — Не вызывающий подозрения (2 балла)}
      - {name: TR3 — Умеренно подозрительный (3 балла)}
      - {name: TR4 — Вызывающий подозрение (4–6 баллов)}
      - {name: TR5 — Высокоподозрительный (≥7 баллов)}
    - id: nodule_size
      name: Максимальный размер узла
      full_name: Максимальный (AP) диаметр узлового образования
      unit: мм
      pathology_desc: '>10 мм — рекомендована тонкоигольная аспирационная биопсия
        (FNA) при подозрительных признаках'
      source: 2016 ATA Guidelines [10]; 2017 ACR TI-RADS [11]
    - id: nodule_vascularity
      name: васкуляризация узла
      full_name: Паттерн кровотока в узловом образовании по цветному допплеровскому
        картированию
      source: 2023 AIUM Thyroid Practice Parameter [2]; 2026 EFSUMB Thyroid Guidelines
        [6][7]
      gradations:
      - {name: Аvascularный}
      - {name: Периферический кровоток (rim flow)}
      - {name: Центральный кровоток}
      - {name: Смешанный (периферический + центральный)}
      - {name: Массивный (hypervascular)}
