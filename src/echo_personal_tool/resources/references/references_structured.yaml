- name: Протезы клапанов
  slug: prosthetic_valves
  pathologies:
  - name: Митральная позиция
    slug: mitral_position
    image_paths:
    - Mitral_prosthetic_2.png
    parameters:
    - id: mv_prosth_gradient_mean
      name: Средний градиент
      unit: мм рт. ст.
      pathology_desc: 'Мех. протез: <5, Био: <8'
      source: 2021, ESC/EACTS, 2021 ESC/EACTS Guidelines for the Management of Valvular
        Heart Disease
    - id: mv_prosth_orifice
      name: Effective Orifice Area (EOA)
      unit: см²
      pathology_desc: Зависит от размера протеза
      source: 2021, ESC/EACTS, 2021 ESC/EACTS Guidelines for the Management of Valvular
        Heart Disease
    - id: mv_prosth_pht
      name: Полураспад PHT
      unit: мс
      pathology_desc: <130 норма, 130-220 подозрение, >220 стеноз
      source: 2021, ESC/EACTS, 2021 ESC/EACTS Guidelines for the Management of Valvular
        Heart Disease
    - id: mv_prosth_regurg
      name: Парапротезная регургитация
      pathology_desc: VC <3 лёгкая, 3-6 умеренная, >6 тяжёлая
      source: 2019, ASE/SCAI/SCMR, Guidelines for the Evaluation of Valvular Regurgitation
        After Percutaneous Valve Repair or Replacement
      unit: ''
  - name: Аортальная позиция
    slug: aortic_position
    image_paths:
    - Aortic_prosthetic_1.png
    - Aotric_prosthetic_2.png
    - Aortic_prosthetic_3.png
    - Aortic_prosthetic_1 (1).png
    parameters:
    - id: av_prosth_gradient_mean
      name: Средний градиент
      unit: мм рт. ст.
      pathology_desc: 'Мех. протез: <20, Био: <30'
      source: 2021, ESC/EACTS, 2021 ESC/EACTS Guidelines for the Management of Valvular
        Heart Disease
    - id: av_prosth_orifice
      name: Effective Orifice Area (EOA)
      unit: см²
      pathology_desc: Зависит от размера протеза
      source: 2021, ESC/EACTS, 2021 ESC/EACTS Guidelines for the Management of Valvular
        Heart Disease
    - id: av_prosth_dvi
      name: Doppler Velocity Index (DVI)
      norm_male:
        low: 0.35
      pathology_desc: <0.35 — стеноз
      source: 2021, ESC/EACTS, 2021 ESC/EACTS Guidelines for the Management of Valvular
        Heart Disease
      unit: ''
    - id: av_prosth_regurg
      name: Парапротезная регургитация
      pathology_desc: VC <3 лёгкая, 3-6 умеренная, >6 тяжёлая
      source: 2019, ASE/SCAI/SCMR, Guidelines for the Evaluation of Valvular Regurgitation
        After Percutaneous Valve Repair or Replacement
      unit: ''
- name: Прочее
  slug: other
  pathologies:
  - name: Общие показатели
    slug: general
    parameters:
    - id: heart_rate
      name: Частота сердечных сокращений (ЧСС)
      unit: уд/мин
      norm_male:
        low: 60
        high: 100
      norm_female:
        low: 60
        high: 100
      source: 2015, ASE, Guidelines for the Standardization in Echocardiography
    - id: bsa
      name: Площадь поверхности тела (ППТ)
      unit: м²
      pathology_desc: 'Расчёт по DuBois: 0.007184 × рост^0.725 × вес^0.425'
      source: 2015, ASE, Guidelines for the Standardization in Echocardiography
    - id: blood_pressure
      name: Артериальное давление (АД)
      unit: мм рт. ст.
      pathology_desc: Систолическое / Диастолическое
      source: 2015, ASE, Guidelines for the Standardization in Echocardiography
  - name: Методика измерений
    slug: measurement_technique
    parameters:
    - id: simpson_method
      name: Метод Симпсона (модифицированный)
      pathology_desc: 2D или 3D, 4-камерная + 2-камерная позиции
      source: 2015, ASE, Guidelines for the Standardization in Echocardiography
      unit: ''
    - id: doppler_angle
      name: Угол допплера
      unit: °
      pathology_desc: <20° — точное измерение
      source: 2015, ASE, Guidelines for the Standardization in Echocardiography
    - id: pisa_radius
      name: Радиус PISA
      unit: мм
      pathology_desc: Измерение от митральной/аортальной створки
      source: 2019, ASE/SCAI/SCMR, Guidelines for the Evaluation of Valvular Regurgitation
        After Percutaneous Valve Repair or Replacement
  - name: Некомпактный миокард левого желудочка
    slug: lv_noncompaction
    image_paths:
    - Non_compact_LV.png
    parameters:
    - id: nc_c_ratio
      name: Отношение некомпактного/компактного слоя (NC/C)
      norm_male:
        high: 2.0
      norm_female:
        high: 2.0
      pathology_desc: ≥2.0 (в систолу, 4К) — некомпактность (критерии Jenni)
      source: 2001, Jenni et al., Echocardiographic and Pathoanatomical Characteristics
        of Isolated Left Ventricular Non-Compaction
      unit: ''
    - id: nc_compact_layer
      name: Компактный слой
      pathology_desc: Тонкий компактный слой с гипертрабекулярностью апикальных сегментов
      source: 2001, Jenni et al., Echocardiographic and Pathoanatomical Characteristics
        of Isolated Left Ventricular Non-Compaction
      unit: ''
    - id: nc_trabeculations
      name: Число трабекул
      pathology_desc: '>3 выраженных трабекул в одной плоскости (Stöllberger)'
      source: 2001, Jenni et al., Echocardiographic and Pathoanatomical Characteristics
        of Isolated Left Ventricular Non-Compaction
      unit: ''
  - name: Открытый артериальный проток
    slug: pda
    image_paths:
    - PDA.png
    parameters:
    - id: pda_flow
      name: Поток в лёгочной артерии
      pathology_desc: Непрерывный систоло-диастолический поток (супрастернальная позиция)
      source: 2018, AHA/ACC, Guideline for the Management of Adults With Congenital
        Heart Disease
      unit: ''
    - id: pda_shunt
      name: Направление шунта
      pathology_desc: Лево-правый; право-левый (Eisenmenger) — цианоз
      source: 2018, AHA/ACC, Guideline for the Management of Adults With Congenital
        Heart Disease
      unit: ''
    - id: pda_lv_overload
      name: Признаки перегрузки ЛЖ
      pathology_desc: Дилатация ЛЖ/ЛП при значимом сбросе
      source: 2018, AHA/ACC, Guideline for the Management of Adults With Congenital
        Heart Disease
      unit: ''
