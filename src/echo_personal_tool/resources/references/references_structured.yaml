  - name: Диастолическая функция левого желудочка
    slug: lv_diastolic
    image_paths:
    - Diastolic_dysfunc_LV.png
    - Diastolog2.png
    - Diastolic_other1.png
    - Diastolic_other2.png
    parameters:
    - id: ea_ratio
      name: Соотношение E/A
      norm_male:
        low: 0.8
        high: 2.0
      norm_female:
        low: 0.8
        high: 2.0
      pathology_desc: <0.8 (I тип), >2.0 (III тип)
      source: 2016, ASE, Recommendations for the Evaluation of Left Ventricular Diastolic
        Function by Echocardiography
      unit: ''
    - id: dt
      name: Время замедления E (DT) (мс) (мс) (мс) (мс) (мс) (мс) (мс) (мс)
      full_name: Время замедления E (DT)
      unit: мс
      norm_male:
        low: 160.0
        high: 200.0
      norm_female:
        low: 160.0
        high: 200.0
      pathology_desc: <160 или >200
      source: 2016, ASE, Recommendations for the Evaluation of Left Ventricular Diastolic
        Function by Echocardiography
    - id: e_e_prime_avg
      name: Среднее E/e'
      norm_male:
        high: 10.0
      norm_female:
        high: 10.0
      pathology_desc: ≥14 — повыш. давление; 10-14 — серая зона
      source: 2016, ASE, Recommendations for the Evaluation of Left Ventricular Diastolic
        Function by Echocardiography
      unit: ''
    - id: e_prime_sept
      name: e' септальная (см/с) (см/с) (см/с) (см/с) (см/с) (см/с) (см/с) (см/с)
      full_name: e' септальная
      unit: см/с
      norm_male:
        low: 7.0
      norm_female:
        low: 7.0
      pathology_desc: <7
      source: 2016, ASE, Recommendations for the Evaluation of Left Ventricular Diastolic
        Function by Echocardiography
    - id: e_prime_lat
      name: e' латеральная (см/с) (см/с) (см/с) (см/с) (см/с) (см/с) (см/с) (см/с)
      full_name: e' латеральная
      unit: см/с
      norm_male:
        low: 10.0
      norm_female:
        low: 10.0
      pathology_desc: <10
      source: 2016, ASE, Recommendations for the Evaluation of Left Ventricular Diastolic
        Function by Echocardiography
    - id: la_vol_index
      name: Объём ЛП (LAVi) (мл/м²) (мл/м²) (мл/м²) (мл/м²) (мл/м²) (мл/м²) (мл/м²)
        (мл/м²)
      full_name: Объём ЛП (LAVi)
      unit: мл/м²
      norm_male:
        high: 34.0
      norm_female:
        high: 34.0
      pathology_desc: ≥34 — повышение
      source: 2016, ASE, Recommendations for the Evaluation of Left Ventricular Diastolic
        Function by Echocardiography
    - id: tr_vmax
      name: Максимальная скорость ТР (м/с) (м/с) (м/с) (м/с) (м/с) (м/с) (м/с) (м/с)
      full_name: Максимальная скорость ТР
      unit: м/с
      norm_male:
        high: 2.8
      norm_female:
        high: 2.8
      pathology_desc: '>2.8 — лёгочная гипертензия'
      source: 2016, ASE, Recommendations for the Evaluation of Left Ventricular Diastolic
        Function by Echocardiography
  - name: Сегменты и кровоснабжение левого желудочка
    slug: lv_segments
    image_paths:
