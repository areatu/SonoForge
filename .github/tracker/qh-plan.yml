# QH-план → GitHub Projects: определение трекера для .github/scripts/project_sync.py
#
# Этот файл — единственный источник структуры трекера (labels, milestones, epic-issues).
# Текст самой спеки остаётся в docs/superpowers/specs/2026-10-13-quality-safety-hardening-
# spec-plan-ru.md; здесь только то, что нужно доске.
#
# Правила:
#   * `state:` применяется ТОЛЬКО при создании issue. Дальше состояние issue —
#     авторитетное (доска отражает реальность). Массово перезаписать состояния
#     можно только явным флагом --enforce-state.
#   * `slices` — чеклист. Префикс "[x] " означает выполненный срез. В тело issue
#     попадает снимок; он обновляется только по --refresh-bodies.
#   * Статус на доске вычисляется из состояния issue и label'ов status:*,
#     а не хранится отдельным полем в этом файле.
#
# Запуск: см. docs/reviews/2026-10-14-qh-plan-github-tracker-mapping-ru.md
#
# Токен зависит от владельца проекта (project.owner ниже — user, не организация):
#   * проект пользователя  → classic PAT со scopes 'project' + 'repo'; fine-grained PAT
#     к user-owned проектам не имеет доступа (документированное ограничение GitHub);
#   * проект организации   → fine-grained PAT: Organization permissions → Projects: Read and write.

version: 1

# Короткое имя плана: попадает в поле Plan доски и в сводки.
plan_name: "QH"

# Снимок плана: дата, к которой относится содержимое ниже (не дата прогона).
snapshot: "2026-10-21"
spec: "docs/superpowers/specs/2026-10-13-quality-safety-hardening-spec-plan-ru.md"

project:
  # ВНИМАНИЕ: токен (PAT) в этом файле НЕ хранится и не должен. Файл коммитится в git.
  # Секрет задаётся отдельно: GitHub → Settings → Secrets and variables → Actions →
  # New repository secret, имя ровно PROJECTS_TOKEN (это имя читает .github/workflows/project-sync.yml).
  # Здесь — только владелец и номер/название проекта.
  #
  # Владелец проекта: user (areatu) или org. Скрипт сначала пробует user, затем organization.
  owner: areatu
  # Доска ищется по номеру, а если его нет — по точному названию.
  # Номер берётся из URL доски: /users/areatu/projects/N (user) или /orgs/<org>/projects/N (org).
  # Пока номер неизвестен (доска создаётся первым прогоном) — работает поиск по title.
  # number: 5
  title: "SonoForge Tracker"
  # Создать доску, если её ещё нет (действует только в режиме bootstrap, не в check/dry-run).
  create: true
  # Привязать доску к репозиторию, чтобы она была видна во вкладке Projects (нужны права admin).
  link_to_repo: true
  fields:
    status: "Status"          # встроенное поле, создавать не нужно
    gate: "Gate"             # SINGLE_SELECT, создаёт bootstrap --create-fields
    size: "Size"             # SINGLE_SELECT
    plan: "Plan"             # TEXT

labels:
  - {name: "qh", color: "5319e7", description: "План QH — качество и безопасность"}
  - {name: "gate:G0", color: "0e8a16", description: "Gate G0 — baseline"}
  - {name: "gate:G1", color: "0e8a16", description: "Gate G1 — data safety"}
  - {name: "gate:G1-STE", color: "fbca04", description: "Gate G1-STE — STE gold (BLOCKED)"}
  - {name: "gate:G2", color: "0e8a16", description: "Gate G2 — security / transport"}
  - {name: "gate:G3", color: "0e8a16", description: "Gate G3 — viewer / lifecycle"}
  - {name: "gate:G4", color: "0e8a16", description: "Gate G4 — diagnostics / boundaries"}
  - {name: "gate:G5a", color: "0e8a16", description: "Gate G5a — packaged release"}
  - {name: "gate:G5b", color: "fbca04", description: "Gate G5b — OS signing (BLOCKED)"}
  - {name: "status:partial", color: "fbca04", description: "Срез выполнен, пакет не закрыт"}
  - {name: "status:blocked", color: "b60205", description: "Внешний блокер — не код"}
  - {name: "size:S", color: "c2e0c6", description: "Относительный размер: small"}
  - {name: "size:M", color: "bfd4f2", description: "Относительный размер: medium"}
  - {name: "size:L", color: "d4c5f9", description: "Относительный размер: large"}
  - {name: "p0", color: "b60205", description: "Блокирует release gate"}

milestones:
  - title: "G0 — baseline"
    description: "Воспроизводимый baseline, characterization, lifecycle harness и трассируемость S-01…S-12."
  - title: "G1 — data safety"
    description: "S-01…S-07/S-10/S-11 в согласованном scope: identity, isolation, freshness, persistence, delete, partial restore, honest failure."
  - title: "G1-STE — STE gold"
    description: "BLOCKED: same-frame gold, vendor definitions/manifest, owner-approved tolerances, доступ к данным."
  - title: "G2 — security / transport"
    description: "Required security contracts ломаются при отключении защиты; миграция legacy-профилей безопасна; policy подтверждён администратором."
  - title: "G3 — viewer / lifecycle"
    description: "Декомпозиция ViewerWidget без изменения поведения + lifecycle budgets на reference runner."
  - title: "G4 — diagnostics / boundaries"
    description: "Адресная обработка критических failures, sanitized diagnostics, ноль прямых domain→infrastructure."
  - title: "G5a — packaged release"
    description: "Locked package matrix, clean-machine evidence, финальные manifests/provenance."
  - title: "G5b — OS signing"
    description: "BLOCKED: провайдер подписи, сертификаты, approval и проверка опубликованных assets."

