    title: "QH-0 — baseline, reproductions, characterization, lifecycle harness"
    milestone: "G0 — baseline"
    gate: "G0"
    size: "M"
    state: closed
    labels: ["qh", "gate:G0", "size:M"]
    goal: "Зафиксировать воспроизводимый baseline и трассируемость S-01…S-12 до рефакторингов QH-1b…QH-3."
    spec: "§4, gate G0"
    slices:
      - "[x] Фиксированное окружение и reference runner"
      - "[x] Reproductions через реальные repository/coordinator/session"
      - "[x] Characterization-тесты ViewerWidget"
      - "[x] Lifecycle harness (50/500 циклов) и бюджет RSS"
      - "[x] Матрица трассируемости S-01…S-12 → test ID → CI job → evidence"
      - "[x] Gate G0: PASS"
