# Tool Panel 2.0 → GitHub Projects: определение трекера для .github/scripts/project_sync.py
#
# Источник структуры доски (epics TP-0…TP-7, приёмка A-01…A-17).
# Текст спеки: docs/superpowers/specs/2026-10-15-tool-panel-2-spec-ru.md.
# Правила state/slices — как в qh-plan.yml: `state:` применяется только при создании
# issue, дальше состояние issue авторитетно; чеклист — снимок на `snapshot`.
# Токен в файле НЕ хранится (секрет PROJECTS_TOKEN).
#
# Запуск (после коммита файла):
#   python3 .github/scripts/project_sync.py bootstrap --plan .github/tracker/tool-panel-plan.yml --create-fields
#   python3 .github/scripts/project_sync.py sync --plan .github/tracker/tool-panel-plan.yml
#
# Снимок 2026-10-21: TP-0…TP-5 закрыты (PR #213/#215, #231, #228/#232, #233–#251, #243,
# #261/#262), TP-6 в работе: палитра Ctrl+K и Alt-подсказки влиты (#237), радиальное меню —
# PR #268 (open), бюджеты фильтра палитры A-17 — PR #265 (open).

version: 1
