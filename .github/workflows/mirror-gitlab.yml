name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Push mirror to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history + LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add GitLab remote
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/areatu/SonoForge.git

      - name: Fetch GitLab branches (no tags to avoid clobber)
        run: |
          git fetch gitlab --prune
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

      - name: Push main branch (fast-forward only)
        run: |
          # On tag pushes checkout is detached (no local main) — materialize it from origin.
          # On branch pushes main is already checked out — fetching into it would fail
          # with "refusing to fetch into branch checked out at ...".
          if ! git show-ref --verify --quiet refs/heads/main; then
            git fetch origin main:main
          fi
          git push gitlab main:main --force-with-lease
          # Branch push: main already checked out, `fetch origin main:main`
          # refuses ("refusing to fetch into branch checked out").
          # Tag push: detached HEAD, no local main. Push origin/main
          # directly — works in both cases.
          git fetch origin main --prune
          git push gitlab origin/main:main --force-with-lease
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

      - name: Push tags (force update if needed)
        run: |
          git push gitlab --tags --force
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

      - name: Push LFS objects
        run: |
          git lfs push --all gitlab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}