name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Push mirror to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history + LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add GitLab remote
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/areatu/SonoForge.git

      - name: Push all branches and tags to GitLab
        run: |
          git push gitlab --mirror --force-with-lease
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}