name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.3)"
        required: false
        type: string
      verify_only:
        description: "Build and test packages without publishing a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # actions/attest: id-token mints the Sigstore (Fulcio) OIDC
  # signing certificate, attestations persists the signed provenance statement.
  # Free for public repositories, no keys or PKI to manage.
  id-token: write
  attestations: write

# QH-5a: one locked toolchain for every packaging job (`uv sync --locked`), the
# same policy ci.yml enforces. No `pip install -e .` and no floating
# dependency fallback: a failed locked install fails the job instead of
# shipping an untested dependency set.
env:
  UV_PYTHON_DOWNLOADS: never
  PY_VERSION: "3.11"
  UV_VERSION: "0.13.0"

jobs:
  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked build toolchain
        run: uv sync --locked --extra build --python ${{ env.PY_VERSION }}

      - name: Build source distribution
        run: |
          uv run --no-sync python -m hatchling build -t sdist
          ls -la dist/

      # The Presenter pin list is a second dependency list only while it still
      # belongs to this lock; checked once per packaging run.
      - name: Verify the Presenter pins against uv.lock
        run: uv run --no-sync python tools/release/presenter_pins.py

      - name: Attest source tarball provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The source tarball is a published asset too: it gets a record (version,
      # commit, lock hash, digest) even though there is nothing to launch, so
      # `verify_release.py` can account for every declared asset.
      - name: Build record
        run: |
          version=$(uv run --no-sync python -c "import sys; sys.path.insert(0, 'src'); from echo_personal_tool import __version__; print(__version__)")
          uv run --no-sync python tools/release/build_record.py \
            --profile full --platform source --tag "v${version}" \
            --artifact "dist/sonoforge-${version}.tar.gz" \
            --output "dist/build-record-full-source-${version}.json"

      - name: Upload source tarball
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-sdist
          path: |
            dist/*.tar.gz
            dist/build-record-*.json
          # Package transfer between jobs: published files live in the release.
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev librsvg2-bin libxkbcommon-x11-0 \
            libxcb-xinerama0 libxcb-cursor0 libegl1

      - name: Install locked dependencies
        run: uv sync --locked --extra build --python ${{ env.PY_VERSION }}

      - name: Run smoke tests
        run: |
          uv run --no-sync python -c "
          import PySide6, pydicom, numpy, scipy
          print(f'PySide6: {PySide6.__version__}')
          print(f'numpy: {numpy.__version__}')
          print('Dependencies OK')
          "

      - name: Determine package version
        id: version
        run: |
          set -euo pipefail
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from echo_personal_tool import __version__; print(__version__)")
          if [ -z "$version" ]; then
            echo "Could not determine SonoForge version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .deb (lite)
        run: ./build/linux/build-lite.sh

      - name: Verify .deb
        run: |
          DEB=$(ls dist/sonoforge_*.deb)
          echo "Package: $DEB"
          echo "Size: $(du -h "$DEB" | cut -f1)"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | head -20

      # QH-5a (A-16): the smoke runs the packaged payload, not the checkout.
      # The lite .deb downloads its dependencies on first run, so the automated
      # smoke covers the payload against the locked dependency set; that network
      # bootstrap is a declared gap in .github/package-matrix.yml.
      - name: Package smoke (payload of the .deb)
        run: |
          set -euo pipefail
          rm -rf .payload
          dpkg-deb -x dist/sonoforge_*.deb .payload
          uv export --locked --no-emit-project --no-hashes -o /tmp/runtime-deps.txt
          uv venv /tmp/payload-venv --python ${{ env.PY_VERSION }}
          uv pip install --python /tmp/payload-venv/bin/python -r /tmp/runtime-deps.txt
          uv run --no-sync python tools/release/run_package_smoke.py \
            --runner payload \
            --payload-root .payload/opt/sonoforge/lib \
            --interpreter /tmp/payload-venv/bin/python \
            --profile full \
            --workdir package-smoke \
            --evidence dist/package-smoke-full-linux-amd64.json

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          uv pip install --python .venv "cyclonedx-bom==$(python .github/scripts/locked_version.py cyclonedx-bom)"
          version="${{ steps.version.outputs.version }}"
          out="dist/SonoForge-${version}-linux-amd64.sbom.cdx.json"
          # --spec-version is pinned deliberately: actions/attest sniffs the SBOM
          # and rejects CycloneDX 1.7 ("Unsupported SBOM format") as of v4.2.2,
          # while cyclonedx-py defaults track the latest spec.
          # --output-reproducible keeps the SBOM byte-stable for a given
          # environment, so re-running a build does not churn the asset.
          uv run --no-sync python -m cyclonedx_py environment \
            --pyproject pyproject.toml \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file "$out"
          python - "$out" "$version" <<'PY'
          import json, sys, uuid
          path, ver = sys.argv[1], sys.argv[2]
          d = json.load(open(path))
          # actions/attest only accepts CycloneDX that carries a serialNumber
          # (checkIsCycloneDX), but --output-reproducible omits it. Add a
          # deterministic serialNumber so the SBOM stays byte-stable.
          if not d.get("serialNumber"):
              d["serialNumber"] = "urn:uuid:" + str(
                  uuid.uuid5(uuid.NAMESPACE_URL, f"https://github.com/areatu/SonoForge/releases/tag/v{ver}")
              )
              json.dump(d, open(path, "w"), indent=2)
          print(f"SBOM: {len(d.get('components', []))} components, spec {d['specVersion']}, format {d['bomFormat']}, serial={d['serialNumber']}")
          PY

      - name: Attest .deb provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/sonoforge_*.deb

      - name: Attest .deb SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/sonoforge_*.deb
          sbom-path: dist/SonoForge-${{ steps.version.outputs.version }}-linux-amd64.sbom.cdx.json

      - name: Build record
        run: |
          version="${{ steps.version.outputs.version }}"
          uv run --no-sync python tools/release/build_record.py \
            --profile full --platform linux-amd64 --tag "v${version}" \
            --artifact "dist/sonoforge_${version}_amd64.deb" \
            --sbom "dist/SonoForge-${version}-linux-amd64.sbom.cdx.json" \
            --smoke-evidence "dist/package-smoke-full-linux-amd64.json" \
            --output "dist/build-record-full-linux-amd64-${version}.json"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-deb
          path: |
            dist/sonoforge_*.deb
            dist/*.sbom.cdx.json
            dist/build-record-*.json
            dist/package-smoke-*.json
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra build --python ${{ env.PY_VERSION }}

      - name: Run smoke tests
        run: |
          uv run --no-sync python -c "
          import PySide6, pydicom, numpy, scipy
          print(f'PySide6: {PySide6.__version__}')
          print(f'numpy: {numpy.__version__}')
          print('Dependencies OK')
          "
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Determine package version
        id: version
        run: |
          $version = (python -c "import sys; sys.path.insert(0, 'src'); from echo_personal_tool import __version__; print(__version__)").Trim()
          if (-not $version) { throw "Could not determine SonoForge version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build portable exe and onedir application
        run: |
          uv run --no-sync python -m PyInstaller sonoforge-standalone.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = "${{ steps.version.outputs.version }}"
          Copy-Item dist\SonoForge.exe "dist\SonoForge-$version-portable.exe"

          uv run --no-sync python -m PyInstaller build/windows/build.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Inno Setup installer
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $iscc "/DMyAppVersion=$version" "build/windows/sonoforge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows packages
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $setup = "dist\SonoForge-Setup-$version-x64.exe"
          $portable = "dist\SonoForge-$version-portable.exe"
          $onedirExe = "dist\SonoForge\SonoForge.exe"
          foreach ($path in @($setup, $portable, $onedirExe)) {
            if (-not (Test-Path $path)) { throw "Missing Windows package output: $path" }
          }
          Get-Item $setup, $portable | ForEach-Object {
            Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 1)) MB"
          }

      - name: Smoke-test per-user install and data-preserving uninstall
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = (Resolve-Path "dist\SonoForge-Setup-$version-x64.exe").Path
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Per-user setup failed with exit code $($install.ExitCode)" }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\SonoForge"
          $appExe = Join-Path $installDir "SonoForge.exe"
          $startShortcut = Join-Path ([Environment]::GetFolderPath('Programs')) "SonoForge\SonoForge.lnk"
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) "SonoForge.lnk"
          foreach ($path in @($appExe, $startShortcut, $desktopShortcut)) {
            if (-not (Test-Path $path)) { throw "Per-user install is missing: $path" }
          }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($startShortcut)
          if ($shortcut.TargetPath -ine $appExe) {
            throw "Start Menu shortcut does not target the installed SonoForge executable"
          }
          $arpKeys = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object {
            (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq "SonoForge"
          }
          if (-not $arpKeys) { throw "SonoForge ARP entry was not created for the current user" }

          $dataDir = Join-Path $env:LOCALAPPDATA "SonoForge"
          $dataDirWasPresent = Test-Path $dataDir
          $marker = Join-Path $dataDir ("installer-preserve-test-" + [guid]::NewGuid().ToString() + ".txt")
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content -Path $marker -Value "keep"
          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "Uninstaller was not installed" }
          $remove = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall failed with exit code $($remove.ExitCode)" }
          if (Test-Path $installDir) { throw "Application install directory remains after uninstall" }
          if (-not (Test-Path $marker)) { throw "Silent uninstall unexpectedly removed user data" }
          if ((Test-Path $startShortcut) -or (Test-Path $desktopShortcut)) { throw "Uninstall left a shortcut behind" }
          $remainingArp = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue | Where-Object {
            (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq "SonoForge"
          }
          if ($remainingArp) { throw "Uninstall left the ARP entry behind" }
          Remove-Item $marker -Force
          if (-not $dataDirWasPresent -and -not (Get-ChildItem $dataDir -Force | Select-Object -First 1)) {
            Remove-Item $dataDir -Force
          }

      # QH-5a (A-16): the shipped executables are launched, not imported. The
      # onedir application is the installer payload; the portable onefile is the
      # USB/download artifact. Both must complete first launch → save → restart
      # (second process) → text/PDF export.
      - name: Package smoke (onedir installer payload)
        run: |
          uv run --no-sync python tools/release/run_package_smoke.py `
            --runner artifact --artifact dist/SonoForge/SonoForge.exe `
            --profile full --workdir package-smoke `
            --evidence dist/package-smoke-full-windows-x64.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package smoke (portable onefile exe)
        run: |
          uv run --no-sync python tools/release/run_package_smoke.py `
            --runner artifact --artifact "dist/SonoForge-${{ steps.version.outputs.version }}-portable.exe" `
            --profile full --workdir package-smoke-portable `
            --evidence dist/package-smoke-full-windows-x64-portable.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate CycloneDX SBOM
        run: |
          $ErrorActionPreference = "Stop"
          uv pip install --python .venv "cyclonedx-bom==$(python .github/scripts/locked_version.py cyclonedx-bom)"
          if ($LASTEXITCODE -ne 0) { throw "cyclonedx-bom install failed" }
          $version = "${{ steps.version.outputs.version }}"
          $out = "dist/SonoForge-$version-windows-x64.sbom.cdx.json"
          # --spec-version is pinned deliberately: actions/attest sniffs the SBOM
          # and rejects CycloneDX 1.7 ("Unsupported SBOM format") as of v4.2.2,
          # while cyclonedx-py defaults track the latest spec.
          uv run --no-sync python -m cyclonedx_py environment --pyproject pyproject.toml --spec-version 1.6 --output-format JSON --output-reproducible --output-file $out
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }
          $sbom = Get-Content $out -Raw | ConvertFrom-Json
          Write-Host "SBOM: $($sbom.components.Count) components, spec $($sbom.specVersion), format $($sbom.bomFormat)"
          # actions/attest only accepts CycloneDX with a serialNumber, but
          # --output-reproducible omits it; add a deterministic one.
          python -c "import json,sys,uuid; p,v=sys.argv[1],sys.argv[2]; d=json.load(open(p)); d.setdefault('serialNumber','urn:uuid:'+str(uuid.uuid5(uuid.NAMESPACE_URL,'https://github.com/areatu/SonoForge/releases/tag/v'+v))); json.dump(d,open(p,'w'),indent=2); print('SBOM serialNumber', d['serialNumber'])" $out $version
          if ($LASTEXITCODE -ne 0) { throw "SBOM serialNumber injection failed" }

      - name: Attest Windows package provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/SonoForge-Setup-*-x64.exe
            dist/SonoForge-*-portable.exe

      - name: Attest Windows package SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/SonoForge-Setup-*-x64.exe
            dist/SonoForge-*-portable.exe
          sbom-path: dist/SonoForge-${{ steps.version.outputs.version }}-windows-x64.sbom.cdx.json

      - name: Build record
        run: |
          $version = "${{ steps.version.outputs.version }}"
          uv run --no-sync python tools/release/build_record.py --profile full --platform windows-x64 --tag "v$version" `
            --artifact "dist/SonoForge-Setup-$version-x64.exe" `
            --artifact "dist/SonoForge-$version-portable.exe" `
            --sbom "dist/SonoForge-$version-windows-x64.sbom.cdx.json" `
            --smoke-evidence "dist/package-smoke-full-windows-x64.json" `
            --output "dist/build-record-full-windows-x64-$version.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer and portable exe
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-windows-package
          path: |
            dist/SonoForge-Setup-*-x64.exe
            dist/SonoForge-*-portable.exe
            dist/*.sbom.cdx.json
            dist/build-record-*.json
            dist/package-smoke-*.json
          retention-days: 7

  build-macos-apple-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra build --python ${{ env.PY_VERSION }}

      - name: Run smoke tests
        run: |
          uv run --no-sync python -c "
          import PySide6, pydicom, numpy, scipy
          print(f'PySide6: {PySide6.__version__}')
          print(f'numpy: {numpy.__version__}')
          print('Dependencies OK')
          "

      - name: Convert icon to .icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o src/echo_personal_tool/resources/logo.icns
          rm -rf icon.iconset

      - name: Build standalone macOS Apple Silicon app
        run: uv run --no-sync python -m PyInstaller sonoforge-standalone.spec --noconfirm --clean

      - name: Determine package version
        id: version
        run: |
          set -euo pipefail
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from echo_personal_tool import __version__; print(__version__)")
          if [ -z "$version" ]; then
            echo "Could not determine SonoForge version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [ ! -d dist/SonoForge.app ]; then
            echo "No .app bundle found in dist/"
            ls -la dist/
            exit 1
          fi
          # The versioned name is the canonical asset: build-provenance
          # attestations are digest-keyed and file-name-agnostic, so the version
          # has to live in the name for verification to be version-specific.
          hdiutil create -volname "SonoForge" -srcfolder dist/SonoForge.app -ov -format UDZO "dist/SonoForge-${version}-macos-arm64.dmg"

      - name: Verify DMG
        run: |
          set -euo pipefail
          ls -la dist/
          version="${{ steps.version.outputs.version }}"
          versioned="dist/SonoForge-${version}-macos-arm64.dmg"
          test -f "$versioned"
          hdiutil verify "$versioned"

      # QH-5a (A-16): the .app bundle that goes into the DMG is launched.
      - name: Package smoke (.app bundle)
        run: |
          uv run --no-sync python tools/release/run_package_smoke.py \
            --runner artifact --artifact dist/SonoForge.app/Contents/MacOS/SonoForge \
            --profile full --workdir package-smoke \
            --evidence dist/package-smoke-full-macos-arm64.json

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          uv pip install --python .venv "cyclonedx-bom==$(python .github/scripts/locked_version.py cyclonedx-bom)"
          version="${{ steps.version.outputs.version }}"
          out="dist/SonoForge-${version}-macos-arm64.sbom.cdx.json"
          # --spec-version is pinned deliberately: actions/attest sniffs the SBOM
          # and rejects CycloneDX 1.7 ("Unsupported SBOM format") as of v4.2.2,
          # while cyclonedx-py defaults track the latest spec.
          uv run --no-sync python -m cyclonedx_py environment \
            --pyproject pyproject.toml \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file "$out"
          python - "$out" "$version" <<'PY'
          import json, sys, uuid
          path, ver = sys.argv[1], sys.argv[2]
          d = json.load(open(path))
          # actions/attest only accepts CycloneDX that carries a serialNumber
          # (checkIsCycloneDX), but --output-reproducible omits it. Add a
          # deterministic serialNumber so the SBOM stays byte-stable.
          if not d.get("serialNumber"):
              d["serialNumber"] = "urn:uuid:" + str(
                  uuid.uuid5(uuid.NAMESPACE_URL, f"https://github.com/areatu/SonoForge/releases/tag/v{ver}")
              )
              json.dump(d, open(path, "w"), indent=2)
          print(f"SBOM: {len(d.get('components', []))} components, spec {d['specVersion']}, format {d['bomFormat']}, serial={d['serialNumber']}")
          PY

      - name: Attest DMG provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/SonoForge-*-macos-arm64.dmg

      - name: Attest DMG SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/SonoForge-*-macos-arm64.dmg
          sbom-path: dist/SonoForge-${{ steps.version.outputs.version }}-macos-arm64.sbom.cdx.json

      - name: Build record
        run: |
          version="${{ steps.version.outputs.version }}"
          uv run --no-sync python tools/release/build_record.py \
            --profile full --platform macos-arm64 --tag "v${version}" \
            --artifact "dist/SonoForge-${version}-macos-arm64.dmg" \
            --sbom "dist/SonoForge-${version}-macos-arm64.sbom.cdx.json" \
            --smoke-evidence "dist/package-smoke-full-macos-arm64.json" \
            --output "dist/build-record-full-macos-arm64-${version}.json"

      - name: Upload macOS Apple Silicon artifact
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-macos-arm64
          path: |
            dist/SonoForge-*-macos-arm64.dmg
            dist/*.sbom.cdx.json
            dist/build-record-*.json
            dist/package-smoke-*.json
          retention-days: 7

  release:
    needs: [build-source, build-linux, build-windows, build-macos-apple-silicon]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for tools/release scripts)
        uses: actions/checkout@v7

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git ls-remote --tags origin 'refs/tags/v*' | sort -t/ -k3 -V | tail -1 | sed 's|.*refs/tags/||')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-sdist

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-deb

      - name: Download Windows installer and portable exe
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-windows-package

      - name: Download macOS Apple Silicon artifact
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-macos-arm64

      - name: List downloaded files
        run: ls -la

      - name: Generate release checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Every published name carries the version; the small stable-name
          # manifests (SHA256SUMS, latest.json) bind those names to digests
          # and download URLs.
          files=(
            sonoforge_*.deb
            sonoforge-*.tar.gz
            SonoForge-Setup-*-x64.exe
            SonoForge-*-portable.exe
            SonoForge-*-macos-arm64.dmg
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found to checksum" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Check GPG signing configuration
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GPG_PRIVATE_KEY is not set - publishing SHA256SUMS unsigned. Build-provenance attestations still cover authenticity; see docs/security/code-signing.md (plan step 2)."
          fi

      - name: Sign checksum manifest with GPG
        id: sign
        if: steps.gpg.outputs.enabled == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          keyid=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$keyid" ]; then
            echo "GPG_PRIVATE_KEY imported but contains no secret key" >&2
            exit 1
          fi
          args=(--batch --yes --armor --detach-sign --local-user "$keyid")
          # CI keys are usually stored unencrypted; support a passphrase anyway
          # so the key can stay protected without a hardware token.
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            args+=(--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
          fi
          gpg "${args[@]}" SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          fingerprint=$(gpg --batch --with-colons --list-keys "$keyid" | awk -F: '/^fpr:/ {print $10; exit}')
          echo "Signed SHA256SUMS with $fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Attest release checksum manifest provenance
        uses: actions/attest@v4.2.2
        with:
          # The manifest is the only release asset that binds file *names*
          # (and therefore the version) to digests; attestations themselves are
          # digest-keyed and name-agnostic. Attesting it lets a verifier pin
          # this manifest to this workflow run and then check every asset.
          subject-path: SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            sonoforge_*.deb
            SonoForge-Setup-*-x64.exe
            SonoForge-*-portable.exe
            SonoForge-*-macos-arm64.dmg
            sonoforge-*.tar.gz
            SHA256SUMS
            *.sbom.cdx.json
            build-record-*.json
          generate_release_notes: true
          draft: false
          prerelease: false

      # Published separately rather than through the files: list above so that a
      # missing signature (secret not configured) cannot affect the release.
      - name: Publish GPG signature of the checksum manifest
        if: steps.gpg.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.tag.outputs.tag }}" SHA256SUMS.asc \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published SHA256SUMS.asc (key ${{ steps.sign.outputs.fingerprint }})"

      # latest.json is the one fixed-name asset that stays: versioned binaries
      # plus a tiny stable manifest as the permanent link to the newest build
      # set (the electron-updater latest.yml / Tauri latest.json pattern).
      # presenter.yml refreshes it after attaching the Presenter builds, so the
      # manifest converges on the complete asset list whichever workflow runs
      # last.
      - name: Publish latest.json manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/release/latest_json.py \
            --tag "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --output latest.json
          cat latest.json

      - name: Attest latest.json provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: latest.json

      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.tag.outputs.tag }}" latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published latest.json (permanent link: releases/latest/download/latest.json)"

      # QH-5a slice 3 (A-17): checksums, SBOMs, build records and latest.json are
      # verified against the files a user downloads — downloaded back from the
      # release after publication — and every binary must carry both a
      # provenance and an SBOM attestation. `--profile full` here: the Presenter
      # workflow verifies its own assets and refreshes latest.json afterwards.
      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          version=$(uv run --no-sync python -c "import sys; sys.path.insert(0, 'src'); from echo_personal_tool import __version__; print(__version__)")
          mkdir -p published
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir published --clobber
          uv run --no-sync python tools/release/verify_release.py \
            --dir published \
            --tag "$tag" \
            --version "$version" \
            --profile full \
            --latest-json published/latest.json \
            --attestations \
            --json-out release-verification.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: release-verification.json
          if-no-files-found: ignore
          retention-days: 30
