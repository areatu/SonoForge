name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.3)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip hatch
          hatch build -t sdist
          ls -la dist/

      - name: Upload source tarball
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-sdist
          path: dist/*.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev librsvg2-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "." 2>/dev/null || python -m pip install pyside6 pyqtgraph pydicom numpy scipy opencv-python-headless httpx psutil pynetdicom pyyaml jsonschema onnxruntime reportlab openpyxl keyring

      - name: Run smoke tests
        run: |
          python -c "
          import PySide6, pydicom, numpy, scipy
          print(f'PySide6: {PySide6.__version__}')
          print(f'numpy: {numpy.__version__}')
          print('Dependencies OK')
          "

      - name: Build .deb (lite)
        run: ./build/linux/build-lite.sh

      - name: Verify .deb
        run: |
          DEB=$(ls dist/sonoforge_*.deb)
          echo "Package: $DEB"
          echo "Size: $(du -h "$DEB" | cut -f1)"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | head -20

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-deb
          path: dist/sonoforge_*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "." 2>$null
          if ($LASTEXITCODE -ne 0) {
            python -m pip install pyside6 pyqtgraph pydicom pylibjpeg pylibjpeg-openjpeg pylibjpeg-libjpeg "numpy<2" scipy opencv-python-headless httpx psutil pymupdf pynetdicom pyyaml jsonschema onnxruntime reportlab openpyxl keyring
          }

      - name: Run smoke tests
        run: |
          python -c "
          import PySide6, pydicom, numpy, scipy
          print(f'PySide6: {PySide6.__version__}')
          print(f'numpy: {numpy.__version__}')
          print('Dependencies OK')
          "

      - name: Build standalone exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller sonoforge-standalone.spec --noconfirm --clean

      - name: Verify exe
        run: |
          $exe = Get-Item dist\SonoForge.exe
          Write-Host "Exe: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Upload standalone exe
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-windows-exe
          path: dist\SonoForge.exe

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "." 2>/dev/null || python -m pip install pyside6 pyqtgraph pydicom pylibjpeg pylibjpeg-openjpeg pylibjpeg-libjpeg "numpy<2" scipy opencv-python-headless httpx psutil pymupdf pynetdicom pyyaml jsonschema onnxruntime reportlab openpyxl keyring

      - name: Run smoke tests
        run: |
          python -c "
          import PySide6, pydicom, numpy, scipy
          print(f'PySide6: {PySide6.__version__}')
          print(f'numpy: {numpy.__version__}')
          print('Dependencies OK')
          "

      - name: Convert icon to .icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o src/echo_personal_tool/resources/logo.icns
          rm -rf icon.iconset

      - name: Build standalone macOS Intel app
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller sonoforge-standalone.spec --noconfirm --clean

      - name: Create DMG
        run: |
          if [ -d dist/SonoForge.app ]; then
            hdiutil create -volname "SonoForge" -srcfolder dist/SonoForge.app -ov -format UDZO dist/SonoForge-macos-intel.dmg
          else
            echo "No .app bundle found in dist/"
            ls -la dist/
            exit 1
          fi

      - name: Verify DMG
        run: |
          ls -la dist/
          test -f dist/SonoForge-macos-intel.dmg
          hdiutil verify dist/SonoForge-macos-intel.dmg

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-macos-intel
          path: dist/SonoForge-macos-intel.dmg

  build-macos-apple-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "." 2>/dev/null || python -m pip install pyside6 pyqtgraph pydicom pylibjpeg pylibjpeg-openjpeg pylibjpeg-libjpeg "numpy<2" scipy opencv-python-headless httpx psutil pymupdf pynetdicom pyyaml jsonschema onnxruntime reportlab openpyxl keyring

      - name: Run smoke tests
        run: |
          python -c "
          import PySide6, pydicom, numpy, scipy
          print(f'PySide6: {PySide6.__version__}')
          print(f'numpy: {numpy.__version__}')
          print('Dependencies OK')
          "

      - name: Convert icon to .icns
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/echo_personal_tool/resources/logo.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o src/echo_personal_tool/resources/logo.icns
          rm -rf icon.iconset

      - name: Build standalone macOS Apple Silicon app
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller sonoforge-standalone.spec --noconfirm --clean

      - name: Create DMG
        run: |
          if [ -d dist/SonoForge.app ]; then
            hdiutil create -volname "SonoForge" -srcfolder dist/SonoForge.app -ov -format UDZO dist/SonoForge-macos-arm64.dmg
          else
            echo "No .app bundle found in dist/"
            ls -la dist/
            exit 1
          fi

      - name: Verify DMG
        run: |
          ls -la dist/
          test -f dist/SonoForge-macos-arm64.dmg
          hdiutil verify dist/SonoForge-macos-arm64.dmg

      - name: Upload macOS Apple Silicon artifact
        uses: actions/upload-artifact@v7
        with:
          name: sonoforge-macos-arm64
          path: dist/SonoForge-macos-arm64.dmg

  release:
    needs: [build-source, build-linux, build-windows, build-macos-intel, build-macos-apple-silicon]
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.ref_name }}" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git ls-remote --tags origin 'refs/tags/v*' | sort -t/ -k3 -V | tail -1 | sed 's|.*refs/tags/||')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source tarball
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-sdist

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-deb

      - name: Download Windows exe
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-windows-exe

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-macos-intel

      - name: Download macOS Apple Silicon artifact
        uses: actions/download-artifact@v8
        with:
          name: sonoforge-macos-arm64

      - name: List downloaded files
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            sonoforge_*.deb
            SonoForge.exe
            SonoForge-macos-intel.dmg
            SonoForge-macos-arm64.dmg
            sonoforge-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
