name: STE fixtures (private data repo → compact, analysis-ready)

# The study clips live in the PRIVATE repository areatu/Sonoforge_data
# (data/dicom/For_pero, Git LFS) — they were moved out of this public repo
# because frames contain burned-in patient identifiers. Actions runners fetch
# them with the SONOFORGE_DATA_TOKEN secret and this workflow commits only the
# *compact derivative* (frames as JPEG + scrubbed header summaries) back to the
# branch that triggered it, so the clips become usable for real-data regression
# and UI work without ever publishing the originals.
#
# Runs on push when the exporter changes, or manually via "Run workflow".

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ste_fixture_export.py"
      - ".github/workflows/ste-fixtures.yml"

permissions:
  contents: write

env:
  DATA_REPO: areatu/Sonoforge_data
  SOURCE_DIR: data/dicom/For_pero
  OUT_DIR: tests/fixtures/for_pero

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the data-repo token is configured
        run: |
          if [ -z "${{ secrets.SONOFORGE_DATA_TOKEN }}" ]; then
            echo "::error::SONOFORGE_DATA_TOKEN secret is not set. Add a token with read access to $DATA_REPO in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out the private data repository (with LFS clips)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.SONOFORGE_DATA_TOKEN }}
          path: .data-repo
          lfs: true
          persist-credentials: false

      - name: Stage the study clips into the working tree
        run: |
          set -x
          if [ ! -d ".data-repo/$SOURCE_DIR" ]; then
            echo "::error::$SOURCE_DIR not found in $DATA_REPO"
            exit 1
          fi
          mkdir -p data/dicom
          rm -rf "$SOURCE_DIR"
          cp -r ".data-repo/$SOURCE_DIR" "$SOURCE_DIR"
          rm -rf .data-repo
          ls -l "$SOURCE_DIR" | head -25

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exporters
        run: pip install "numpy<2.0" pydicom opencv-python-headless pillow

      - name: Export compact fixtures
        id: export
        continue-on-error: true
        run: |
          python tools/ste_fixture_export.py --source "$SOURCE_DIR" --out "$OUT_DIR" 2>&1 | tee /tmp/export.log

      - name: Diagnostics (readable from the repository, since run logs are not)
        if: always()
        run: |
          mkdir -p "$OUT_DIR"
          {
            echo "# STE fixture export diagnostics"
            echo
            echo "ref: $(git rev-parse --short HEAD)  source: $DATA_REPO@$SOURCE_DIR"
            echo
            echo "## sizes in $SOURCE_DIR"
            ls -l "$SOURCE_DIR" || true
            echo
            echo "## pointer files remaining (<1024 bytes)"
            find "$SOURCE_DIR" -type f -size -1024c -print 2>/dev/null || true
            echo
            echo "## export log"
            cat /tmp/export.log 2>/dev/null || echo "(no log)"
          } > "$OUT_DIR/_diagnostics.md"

      - name: Commit the derivative back to this branch
        if: always()
        run: |
          git config user.name "ste-fixture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$OUT_DIR"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(ste): compact fixtures from the private data repo [skip ci]"
          git push
