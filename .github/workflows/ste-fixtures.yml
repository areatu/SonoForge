name: STE fixtures (LFS → compact, analysis-ready)

# The study clips live in Git LFS. Development sandboxes can reach the Git host
# but not the LFS content host, while Actions runners can read LFS. This workflow
# therefore runs the export there and commits the *compact derivative* (frames as
# JPEG + scrubbed header summaries) back to the branch that triggered it, so the
# clips become usable for real-data regression runs and UI work.
#
# Runs on push when the exporter changes, or manually via "Run workflow".

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ste_fixture_export.py"
      - ".github/workflows/ste-fixtures.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS content is real
        run: |
          ls -l data/dicom/For_pero | head -20
          python3 - <<'PY'
          import pathlib, sys
          pointers = [p.name for p in pathlib.Path("data/dicom/For_pero").iterdir() if p.is_file() and p.stat().st_size < 1024]
          if pointers:
              print("still pointers:", pointers)
              sys.exit(1)
          print("LFS content present")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exporters
        run: pip install "numpy<2.0" pydicom opencv-python-headless pillow

      - name: Export compact fixtures
        run: python tools/ste_fixture_export.py --source data/dicom/For_pero --out tests/fixtures/for_pero

      - name: Report bundle size
        run: du -sh tests/fixtures/for_pero && find tests/fixtures/for_pero -type f | wc -l

      - name: Commit the derivative back to this branch
        run: |
          git config user.name "ste-fixture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f tests/fixtures/for_pero
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(ste): compact fixtures from the LFS study clips [skip ci]"
          git push
