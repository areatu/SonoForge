name: STE fixtures (LFS → compact, analysis-ready)

# The study clips live in Git LFS on the default branch. Development sandboxes can
# reach the Git host but not the LFS content host, while Actions runners can read
# LFS. This workflow therefore runs the export there and commits the *compact
# derivative* (frames as JPEG + scrubbed header summaries) back to the branch that
# triggered it, so the clips become usable for real-data regression and UI work.
#
# It is deliberately self-contained: the source clips are pulled from the default
# branch into the runner's working tree and are never committed to this branch.
#
# Runs on push when the exporter changes, or manually via "Run workflow".

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ste_fixture_export.py"
      - ".github/workflows/ste-fixtures.yml"

permissions:
  contents: write

env:
  SOURCE_REF: main
  SOURCE_DIR: data/dicom/For_pero
  OUT_DIR: tests/fixtures/for_pero

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the study clips out of LFS (they live on the default branch)
        run: |
          set -x
          git fetch --no-tags origin "$SOURCE_REF"
          git show "origin/$SOURCE_REF:.gitattributes" > .gitattributes
          git checkout "origin/$SOURCE_REF" -- "$SOURCE_DIR"
          git add .gitattributes
          git lfs pull --include="$SOURCE_DIR/*" --exclude=""
          ls -l "$SOURCE_DIR" | head -25

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exporters
        run: pip install "numpy<2.0" pydicom opencv-python-headless pillow

      - name: Export compact fixtures
        id: export
        continue-on-error: true
        run: |
          python tools/ste_fixture_export.py --source "$SOURCE_DIR" --out "$OUT_DIR" 2>&1 | tee /tmp/export.log

      - name: Diagnostics (readable from the repository, since run logs are not)
        if: always()
        run: |
          mkdir -p "$OUT_DIR"
          {
            echo "# STE fixture export diagnostics"
            echo
            echo "ref: $(git rev-parse --short HEAD)  source: origin/$SOURCE_REF"
            echo
            echo "## sizes in $SOURCE_DIR"
            ls -l "$SOURCE_DIR" || true
            echo
            echo "## pointer files remaining (<1024 bytes)"
            find "$SOURCE_DIR" -type f -size -1024c -print 2>/dev/null || true
            echo
            echo "## git lfs ls-files (first 30)"
            git lfs ls-files | head -30 || true
            echo
            echo "## export log"
            cat /tmp/export.log 2>/dev/null || echo "(no log)"
          } > "$OUT_DIR/_diagnostics.md"

      - name: Commit the derivative back to this branch
        if: always()
        run: |
          git config user.name "ste-fixture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$OUT_DIR"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(ste): compact fixtures from the LFS study clips [skip ci]"
          git push
