name: STE fixtures (private data repo → compact, analysis-ready)

# The study clips live in the PRIVATE repository areatu/Sonoforge_data
# (data/dicom/For_pero, Git LFS) — they were moved out of this public repo
# because frames contain burned-in patient identifiers. Actions runners fetch
# them with the SONOFORGE_DATA_TOKEN secret and this workflow commits only the
# *compact derivative* (frames as JPEG + scrubbed header summaries) back to the
# branch that triggered it, so the clips become usable for real-data regression
# and UI work without ever publishing the originals.
#
# Runs on push when the exporter changes, or manually via "Run workflow".

on:
  workflow_dispatch:
  push:
    # Never on tags: a tag checkout is detached HEAD and the derivative cannot
    # be committed back (git push exits 128). Fixtures are refreshed on branch
    # pushes only.
    tags-ignore:
      - "**"
    paths:
      - "tools/ste_fixture_export.py"
      - ".github/workflows/ste-fixtures.yml"

permissions:
  contents: write
  pull-requests: write

env:
  DATA_REPO: areatu/Sonoforge_data
  SOURCE_DIR: data/dicom/For_pero
  OUT_DIR: tests/fixtures/for_pero
  # QH-5a: the exporter runs on the same locked dependency set as every other
  # job. It used to `pip install numpy<2.0 pydicom opencv-python-headless pillow`
  # from PyPI, so the derivative could be produced by versions no other job had
  # ever run.
  UV_PYTHON_DOWNLOADS: never
  PY_VERSION: "3.11"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the data-repo token is configured
        run: |
          if [ -z "${{ secrets.SONOFORGE_DATA_TOKEN }}" ]; then
            echo "::error::SONOFORGE_DATA_TOKEN secret is not set. Add a token with read access to $DATA_REPO in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out the private data repository (with LFS clips)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.SONOFORGE_DATA_TOKEN }}
          path: .data-repo
          lfs: true
          persist-credentials: false

      - name: Stage the study clips into the working tree
        run: |
          set -x
          if [ ! -d ".data-repo/$SOURCE_DIR" ]; then
            echo "::error::$SOURCE_DIR not found in $DATA_REPO"
            exit 1
          fi
          mkdir -p data/dicom
          rm -rf "$SOURCE_DIR"
          cp -r ".data-repo/$SOURCE_DIR" "$SOURCE_DIR"
          rm -rf .data-repo
          ls -l "$SOURCE_DIR" | head -25

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python ${{ env.PY_VERSION }}

      - name: Export compact fixtures
        id: export
        continue-on-error: true
        run: |
          uv run --no-sync python tools/ste_fixture_export.py --source "$SOURCE_DIR" --out "$OUT_DIR" 2>&1 | tee /tmp/export.log

      - name: Diagnostics (readable from the repository, since run logs are not)
        if: always()
        run: |
          mkdir -p "$OUT_DIR"
          {
            echo "# STE fixture export diagnostics"
            echo
            echo "ref: $(git rev-parse --short HEAD)  source: $DATA_REPO@$SOURCE_DIR"
            echo
            echo "## sizes in $SOURCE_DIR"
            ls -l "$SOURCE_DIR" || true
            echo
            echo "## pointer files remaining (<1024 bytes)"
            find "$SOURCE_DIR" -type f -size -1024c -print 2>/dev/null || true
            echo
            echo "## export log"
            cat /tmp/export.log 2>/dev/null || echo "(no log)"
          } > "$OUT_DIR/_diagnostics.md"

      - name: Commit the derivative back to this branch
        if: always() && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ste-fixture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$OUT_DIR"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(ste): compact fixtures from the private data repo [skip ci]"
          # The default branch is protected (requires a PR + passing CI), so a
          # direct push is rejected (GH006). On the default branch we commit to a
          # dedicated branch and open a PR instead; on other branches the direct
          # push still works and the PR flow is not needed.
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            BRANCH="chore/ste-fixtures-${GITHUB_SHA::7}"
            git switch -c "$BRANCH"
            git push origin "$BRANCH"
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "chore(ste): refresh compact fixtures" \
              --body "Automated refresh of the compact STE fixtures from the private data repo (exporter ${GITHUB_SHA::7})." \
              --draft
            echo "opened draft PR from $BRANCH"
          else
            git push
          fi
