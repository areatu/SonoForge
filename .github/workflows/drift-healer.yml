# Self-healing for a derived-file drift that turns a PR red although no
# product code failed.
#
# * Presenter pins: Dependabot bumps uv.lock but cannot run
#   `tools/release/presenter_pins.py --write`, so TestPresenterPins and the
#   package-smoke pin check fail on every runtime-dependency PR (runs
#   41549459474, 41549368981, 41549311120).
#
# The pytest-baseline heal that used to live here is gone with the baseline
# itself (#473): the inventory gate compares with the base commit, so merging
# main can no longer leave a stale number behind.
#
# The healer rewrites the derived file from its source of truth (uv.lock),
# commits it to the PR branch, and dispatches CI on the new head — pushes made
# with GITHUB_TOKEN deliberately do not start workflows on their own.  The heal
# is idempotent: with the drift gone the next CI failure takes no action and
# the loop stops after one round.

name: Drift healer

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: write

env:
  UV_PYTHON_DOWNLOADS: never

concurrency:
  group: drift-healer-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  heal-derived-files:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # presenter_pins.py reads uv.lock with stdlib tomllib only — no uv, no
      # sync, safe to run on every failed pull-request run.
      - name: Regenerate presenter pins when uv.lock drifted
        id: pins
        run: |
          set -euo pipefail
          changed="false"
          if python tools/release/presenter_pins.py; then
            echo "::notice::presenter pins already match uv.lock"
          else
            echo "::notice::presenter pins drifted from uv.lock — regenerating"
            if ! python tools/release/presenter_pins.py --write; then
              echo "::warning::presenter_pins.py --write failed (unparseable lock?) — needs a human"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git config user.name "drift-healer-bot"
            git config user.email "actions@users.noreply.github.com"
            # build/ is ignored, even though this file is tracked. An explicit
            # path under an ignored directory still needs -f on a fresh checkout.
            git add -f build/presenter/pinned-packages.txt
            if git diff --cached --quiet; then
              echo "::notice::presenter pins unchanged after --write"
            else
              git commit -m "chore(presenter): regenerate pinned-packages.txt from uv.lock"
              changed="true"
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Push healed files and dispatch CI on the new head
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "::warning::could not push healed files to $BRANCH (branch moved or is protected) — needs a human"
            exit 0
          fi
          gh workflow run CI --ref "$BRANCH"
          echo "::notice::dispatched CI on $BRANCH at $(git rev-parse --short HEAD) after healing derived files"
