name: Presenter (lite portable build)

on:
  push:
    tags:
      - "presenter-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. presenter-v0.3.0); leave empty for artifacts only"
        required: false
        type: string

permissions:
  contents: write
  # actions/attest: id-token mints the Sigstore (Fulcio) OIDC
  # signing certificate, attestations persists the signed provenance statement.
  # Free for public repositories, no keys or PKI to manage.
  id-token: write
  attestations: write

env:
  PY_VERSION: "3.11"

jobs:
  smoke:
    name: Presenter smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install system deps (Qt runtime for offscreen tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1

      - name: Install lite dependencies (no onnxruntime / pymupdf / openpyxl)
        run: |
          python -m pip install --upgrade pip
          pip install -r build/presenter/pinned-packages.txt pytest pytest-qt pytest-timeout

      - name: Verify excluded deps are absent
        run: |
          python - <<'EOF'
          import importlib.util
          for mod in ("onnxruntime", "fitz", "pymupdf", "openpyxl", "PySide6.QtWebEngineWidgets"):
              assert importlib.util.find_spec(mod) is None, f"{mod} must NOT be installed for Presenter"
          print("lite dependency set OK")
          EOF

      - name: Run presenter profile tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -e . --no-deps
          SONOFORGE_PROFILE=presenter python -m pytest tests/unit/test_presenter_profile.py -q

      - name: Import smoke (app + main window module, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          SONOFORGE_PROFILE: presenter
        run: |
          python - <<'EOF'
          import os
          assert os.environ["SONOFORGE_PROFILE"] == "presenter"
          import echo_personal_tool.main  # noqa: F401
          from echo_personal_tool.infrastructure.onnx_engine import OnnxInferenceEngine
          engine = OnnxInferenceEngine()
          assert not engine.is_available(), "ONNX must be unavailable in Presenter"
          from echo_personal_tool.infrastructure import profile
          assert profile.is_presenter() and not profile.has_reference_ui() and not profile.has_ai_segmentation()
          import echo_personal_tool.presentation.main_window  # noqa: F401
          import echo_personal_tool.presentation.measures_menu  # noqa: F401
          print("presenter import smoke OK")
          EOF

  build-windows:
    name: Windows onefile .exe
    runs-on: windows-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build/presenter/pinned-packages.txt pyinstaller

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $version = (python -c "import sys; sys.path.insert(0, 'src'); from echo_personal_tool import __version__; print(__version__)").Trim()
          if (-not $version) { throw "Could not determine SonoForge version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build onefile exe
        run: python -m PyInstaller build/presenter/sonoforge-presenter.spec --noconfirm --clean

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = Get-Item dist\SonoForgePresenter.exe
          "{0}: {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)
          if ($exe.Length -gt 250MB) { throw "exe unexpectedly large — check excludes" }

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --quiet --upgrade cyclonedx-bom
          if ($LASTEXITCODE -ne 0) { throw "cyclonedx-bom install failed" }
          $version = "${{ steps.version.outputs.version }}"
          $out = "dist/SonoForge-Presenter-$version-windows-x64.sbom.cdx.json"
          # Built from the pinned lite dependency set, which is exactly what the
          # onefile bundle contains. --spec-version is pinned deliberately:
          # actions/attest rejects CycloneDX 1.7 ("Unsupported SBOM format") as
          # of v4.2.2, while cyclonedx-py defaults track the latest spec.
          python -m cyclonedx_py requirements build/presenter/pinned-packages.txt --spec-version 1.6 --output-format JSON --output-reproducible --output-file $out
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }
          $sbom = Get-Content $out -Raw | ConvertFrom-Json
          Write-Host "SBOM: $($sbom.components.Count) components, spec $($sbom.specVersion), format $($sbom.bomFormat)"

      - name: Publish versioned artifact
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # The versioned name is the canonical asset: attestations are
          # digest-keyed and file-name-agnostic, so the version has to live in
          # the name for verification to be version-specific. The fixed name is
          # kept as a byte-identical alias so the existing download URL and the
          # README instructions keep working.
          Copy-Item dist\SonoForgePresenter.exe "dist\SonoForgePresenter-$version.exe"
          if ((Get-FileHash dist\SonoForgePresenter.exe).Hash -ne (Get-FileHash "dist\SonoForgePresenter-$version.exe").Hash) {
            throw "Versioned alias is not byte-identical to the built exe"
          }
          Get-ChildItem dist\SonoForgePresenter*.exe | ForEach-Object { Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Attest artifact provenance
        uses: actions/attest@v4
        with:
          # dist/SonoForgePresenter.exe is a byte-identical alias of the
          # versioned exe, so it shares its digest and is covered by this
          # attestation without needing one of its own.
          subject-path: dist/SonoForgePresenter-*.exe

      - name: Attest artifact SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/SonoForgePresenter-*.exe
          sbom-path: dist/SonoForge-Presenter-${{ steps.version.outputs.version }}-windows-x64.sbom.cdx.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SonoForgePresenter-windows
          path: |
            dist/SonoForgePresenter-*.exe
            dist/SonoForgePresenter.exe
            dist/*.sbom.cdx.json
          retention-days: 30

  build-linux:
    name: Linux AppImage
    # ubuntu-22.04 (glibc 2.35) — AppImage runs on any host with glibc >= 2.34,
    # matching the PySide6 manylinux_2_34 wheels. ubuntu-latest (24.04) would
    # cut off older distros for no reason.
    runs-on: ubuntu-22.04
    needs: smoke
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build/presenter/pinned-packages.txt pyinstaller

      - name: Determine package version
        id: version
        run: |
          set -euo pipefail
          version=$(python -c "import sys; sys.path.insert(0, 'src'); from echo_personal_tool import __version__; print(__version__)")
          if [ -z "$version" ]; then
            echo "Could not determine SonoForge version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: ./build/presenter/build-appimage.sh

      - name: Verify artifact
        run: |
          APPIMAGE=$(ls dist/SonoForge-Presenter-*-x86_64.AppImage)
          echo "Package: $APPIMAGE"
          du -h "$APPIMAGE"
          file "$APPIMAGE"

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade cyclonedx-bom
          version="${{ steps.version.outputs.version }}"
          out="dist/SonoForge-Presenter-${version}-linux-x86_64.sbom.cdx.json"
          # Built from the pinned lite dependency set, which is exactly what the
          # AppImage contains. --spec-version is pinned deliberately:
          # actions/attest rejects CycloneDX 1.7 ("Unsupported SBOM format") as
          # of v4.2.2, while cyclonedx-py defaults track the latest spec.
          python -m cyclonedx_py requirements build/presenter/pinned-packages.txt \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file "$out"
          python - "$out" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"SBOM: {len(d.get('components', []))} components, spec {d['specVersion']}, format {d['bomFormat']}")
          PY

      - name: Attest artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/SonoForge-Presenter-*-x86_64.AppImage

      - name: Attest artifact SBOM
        uses: actions/attest@v4
        with:
          # sbom-path takes a single file, not a glob, so it is spelled out from
          # the version output rather than pattern-matched.
          subject-path: dist/SonoForge-Presenter-*-x86_64.AppImage
          sbom-path: dist/SonoForge-Presenter-${{ steps.version.outputs.version }}-linux-x86_64.sbom.cdx.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SonoForgePresenter-linux
          path: |
            dist/SonoForge-Presenter-*-x86_64.AppImage
            dist/*.sbom.cdx.json
          retention-days: 30

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/presenter-v') || github.event.inputs.tag != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: SonoForgePresenter-*

      - name: Generate Presenter checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Presenter assets are published by this workflow, not by release.yml,
          # so the main release SHA256SUMS never lists them. They get their own
          # manifest; digests are written against bare file names so that
          # `sha256sum -c` works in a download directory.
          files=(
            artifacts/SonoForgePresenter-windows/SonoForgePresenter-*.exe
            artifacts/SonoForgePresenter-windows/SonoForgePresenter.exe
            artifacts/SonoForgePresenter-linux/SonoForge-Presenter-*.AppImage
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Presenter binaries to checksum" >&2
            exit 1
          fi
          : > SHA256SUMS-presenter.txt
          for f in "${files[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> SHA256SUMS-presenter.txt
          done
          cat SHA256SUMS-presenter.txt

      - name: Attest Presenter checksum manifest provenance
        uses: actions/attest@v4
        with:
          subject-path: SHA256SUMS-presenter.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Every expected asset class must be present: publishing a partial
          # Presenter release silently would leave an unattestable gap.
          # SonoForgePresenter-<version>.exe is canonical; SonoForgePresenter.exe
          # is a byte-identical alias kept for the existing download URL and the
          # README instructions (attestation verification is digest-based, so the
          # alias resolves through the versioned artifact).
          assets=()
          missing=0
          for pattern in \
            'artifacts/SonoForgePresenter-windows/SonoForgePresenter-*.exe' \
            'artifacts/SonoForgePresenter-windows/SonoForgePresenter.exe' \
            'artifacts/SonoForgePresenter-linux/SonoForge-Presenter-*.AppImage' \
            'artifacts/SonoForgePresenter-*/*.sbom.cdx.json' \
            'SHA256SUMS-presenter.txt' ; do
            matches=( $pattern )
            if [ ${#matches[@]} -eq 0 ]; then
              echo "Missing expected Presenter asset: $pattern" >&2
              missing=1
            else
              assets+=( "${matches[@]}" )
            fi
          done
          if [ "$missing" -ne 0 ]; then
            ls -laR artifacts >&2 || true
            exit 1
          fi
          printf 'Publishing %s\n' "${assets[@]}"
          # Attach to an existing release (e.g. the main vX.Y.Z one) when the
          # tag is already published; otherwise create a dedicated Presenter
          # release (the presenter-vX.Y.Z flow).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              "${assets[@]}"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SonoForge Presenter $TAG" \
              --notes "Lite portable build: no ONNX AI segmentation, no reference UI, portable USB-stick storage. Full PACS support. Every artifact carries a Sigstore build-provenance attestation and an attested CycloneDX SBOM." \
              "${assets[@]}"
          fi
