name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# QH-2a.1: one locked toolchain for every job. uv.lock is the single source of
# truth (`uv sync --locked` fails when pyproject and the lock disagree), the uv
# binary itself is pinned, and uv must use the interpreter installed by
# setup-python instead of silently downloading another Python build.
env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "src")
          from echo_personal_tool import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")
          print(f"Release tag {tag} matches __version__")
          PY
      # ruff and mypy at the versions pinned in uv.lock — floating lint/type
      # versions drift away from `uv run ruff` / `uv run mypy` on developer
      # machines.
      - name: Install the locked lint and typecheck tools
        run: |
          # PySide6 is part of the type-check environment on purpose (#325): the
          # Qt stubs decide whether an ignore in `application`/`infrastructure`
          # suppresses anything, so leaving Qt out made `warn_unused_ignores`
          # report a different set of dead suppressions here than on a
          # developer machine.
          pip install \
            "ruff==$(python .github/scripts/locked_version.py ruff)" \
            "mypy==$(python .github/scripts/locked_version.py mypy)" \
            "PySide6==$(python .github/scripts/locked_version.py PySide6)" \
            "numpy==$(python .github/scripts/locked_version.py numpy)" \
            "opencv-python-headless==$(python .github/scripts/locked_version.py opencv-python-headless)" \
            "pydicom==$(python .github/scripts/locked_version.py pydicom)" \
            "types-PyYAML==$(python .github/scripts/locked_version.py types-PyYAML)"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - name: Function-length ratchet (200-line limit)
        run: python scripts/check_function_length.py
      # #325: a bare `# type: ignore` hides every error on the line and the
      # count may only shrink — see scripts/check_type_ignores.py.
      - name: Type-ignore ratchet (no bare ignores, count only goes down)
        run: python scripts/check_type_ignores.py
      - run: mypy
      # UI-0 (spec 2026-10-16 §5.3): the colour ratchet and the token contrast
      # run in the mandatory "ui-colors" job — it is part of the aggregate
      # test gate, so a new colour literal or a low-contrast pair fails the
      # build.
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Lock file matches pyproject
        run: uv lock --check

  # #324: static and dependency auditing. Two contours on purpose — the
  # shipped runtime closure of uv.lock is a hard gate, the full dev closure
  # is a non-blocking report (dev-only findings must not train anyone to
  # ignore a permanently red job). A weekly re-run of the dependency half
  # lives in security-audit.yml; see SECURITY.md "Dependency contours".
  security_audit:
    name: security-audit (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the locked audit tools
        run: |
          pip install \
            "bandit==$(python .github/scripts/locked_version.py bandit)" \
            "pip-audit==$(python .github/scripts/locked_version.py pip-audit)"
      # Medium+ severity is the gate (bandit -ll); the ~40 Low findings stay
      # visible in a plain local `bandit -r src` run but do not block PRs.
      - name: bandit (medium+ severity)
        run: bandit -r src -ll -q
      - name: Export dependency contours from the lock
        run: |
          uv export --locked --format requirements-txt --no-hashes --no-emit-project -o /tmp/runtime-requirements.txt
          uv export --locked --all-extras --format requirements-txt --no-hashes --no-emit-project -o /tmp/dev-requirements.txt
      - name: pip-audit runtime contour (blocking)
        run: pip-audit -r /tmp/runtime-requirements.txt --no-deps --progress-spinner off
      - name: pip-audit dev contour (report only)
        if: always()
        run: |
          pip-audit -r /tmp/dev-requirements.txt --no-deps --progress-spinner off \
            --format json --output /tmp/pip-audit-dev.json || true
          pip-audit -r /tmp/dev-requirements.txt --no-deps --progress-spinner off || true
      - name: Upload dev-contour audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-dev-report
          path: /tmp/pip-audit-dev.json
          if-no-files-found: ignore
          retention-days: 7

  # Counters before tests: every pytest job waits for this gate (`needs` below),
  # so a test change without
  # `uv run python .github/scripts/update_pytest_baseline.py --fix` fails
  # right after collection instead of after the full matrix (the coverage job
  # repeats the same comparison against the shard inventories).
  test_inventory:
    name: pytest counters gate (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Collection imports every tests/unit/ module, GUI ones included, so the
      # gate carries the same Qt runtime packages as the other Linux jobs.
      - name: Install system dependencies (Linux)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Check pytest partition baseline (collection only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync python .github/scripts/update_pytest_baseline.py --check

  # Linux logic, platform compatibility, GUI, and bench run independently.
  # The logic and GUI selections combine to the full unit-test coverage.
  test_logic:
    name: test-logic (ubuntu-latest, 3.11)
    needs: [test_inventory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Preserve the Linux Qt runtime packages used by the former all-in-one
      # test job; only the GUI/bench commands consume xvfb itself.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1

      # The locked set already excludes PySide6 6.12.0 (Linux QWidget teardown
      # abort): pyproject pins `<6.12` and uv.lock resolves 6.11.1.
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11

      # Linux preserves the repository's default exclusion of interactive tests
      # while selecting every non-GUI item. xdist gives each worker an isolated
      # Python/Qt state; loadfile keeps each module together and in file order.
      - name: Run logic tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          QT_QPA_PLATFORM: offscreen
          PYTEST_CURRENT_NODE_FILE: /tmp/pytest-last-node
          PYTEST_CI_METRICS_FILE: /tmp/pytest-metrics.json
          PYTEST_LOG_FILE: /tmp/pytest.log
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          set +e
          rm -f /tmp/pytest.log /tmp/pytest-last-node* /tmp/pytest-metrics.json /tmp/pytest-junit.xml
          uv run --no-sync pytest tests/unit/ -n auto --dist loadfile --max-worker-restart=2 \
            -vv -p pytest_current_node -p pytest_ci_metrics --tb=line --no-header \
            -m "not gui and not interactive" --durations=25 \
            --junitxml=/tmp/pytest-junit.xml \
            --cov=src/echo_personal_tool --cov-report= \
            > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          python .github/scripts/annotate_pytest_failures.py /tmp/pytest-last-node "$status" < /tmp/pytest.log
          python .github/scripts/check_pytest_counts.py \
            --junit /tmp/pytest-junit.xml --metrics /tmp/pytest-metrics.json
          count_status=$?
          python .github/scripts/check_required_tests.py \
            --metrics /tmp/pytest-metrics.json --required .github/required-tests/formulas.txt
          formulas_status=$?
          if [ "$status" -ne 0 ] && [ -s /tmp/pytest-last-node ]; then
            printf '::error title=pytest recorded active node::%s\n' "$(head -n 1 /tmp/pytest-last-node)"
            printf '::error title=pytest abort::recorded active node (not proof of crash cause): %s\n' "$(head -n 1 /tmp/pytest-last-node)"
          fi
          if [ "$status" -ne 0 ] || [ "$count_status" -ne 0 ] || [ "$formulas_status" -ne 0 ]; then
            exit 1
          fi
          exit 0

      - name: Upload logic test timings and inventory
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-logic-diagnostics
          path: |
            /tmp/pytest.log
            /tmp/pytest-metrics.json
            /tmp/pytest-junit.xml
            /tmp/pytest-last-node*
          if-no-files-found: ignore
          retention-days: 3

      - name: Stage logic coverage data
        if: success() && runner.os == 'Linux'
        run: cp .coverage coverage-logic.data

      - name: Upload logic coverage data
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-logic
          path: coverage-logic.data
          retention-days: 1

  # Keep the macOS/Windows platform-compatibility gate parallel to the Linux
  # coverage-producing job. Preserve the `not gui` filter and explicitly keep
  # the repository's interactive-test exclusion; report each worker's active node.
  #
  # Platform-compatibility cells run the lower bound of
  # `requires-python = ">=3.11"` on macOS and Windows with the same locked set
  # (QH-2a.1), plus the upper supported versions on ubuntu: the 3.12 and 3.13
  # cells were added by S3-02 (#311) when the ceiling moved to `<3.14` and
  # numpy went 2.x. The ubuntu/3.10 cell was dropped on 2026-10-22 when the
  # floor moved to 3.11 for Pillow 13 (see pyproject.toml and
  # docs/reviews/2026-10-22-dependabot-alerts-ru.md); Linux/3.11 stays covered
  # by test_logic/coverage.
  test_compat:
    name: test-logic (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [test_inventory]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: py${{ matrix.python-version }}
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Run logic tests (compat matrix)
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          QT_QPA_PLATFORM: offscreen
          PYTEST_CURRENT_NODE_FILE: pytest-last-node
          PYTEST_CI_METRICS_FILE: pytest-metrics.json
          PYTEST_LOG_FILE: pytest.log
        run: |
          set +e
          rm -f pytest.log pytest-last-node* pytest-metrics.json pytest-junit.xml
          uv run --no-sync pytest tests/unit/ -n auto --dist loadfile --max-worker-restart=2 \
            -vv -p pytest_current_node -p pytest_ci_metrics --tb=line --no-header \
            -m "not gui and not interactive" --durations=25 \
            --junitxml=pytest-junit.xml > pytest.log 2>&1
          status=$?
          cat pytest.log
          python .github/scripts/annotate_pytest_failures.py pytest-last-node "$status" < pytest.log
          python .github/scripts/check_pytest_counts.py \
            --junit pytest-junit.xml --metrics pytest-metrics.json
          count_status=$?
          if [ "$status" -ne 0 ] && [ -s pytest-last-node ]; then
            printf '::error title=pytest recorded active node::%s\n' "$(head -n 1 pytest-last-node)"
            printf '::error title=pytest abort::recorded active node (not proof of crash cause): %s\n' "$(head -n 1 pytest-last-node)"
          fi
          if [ "$status" -ne 0 ] || [ "$count_status" -ne 0 ]; then
            exit 1
          fi
          exit 0
      - name: Upload platform logic diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-logic-diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest.log
            pytest-metrics.json
            pytest-junit.xml
            pytest-last-node*
          if-no-files-found: ignore
          retention-days: 3

  # S3-01 (#310): regression and migration suites join the PR gate on Linux.
  # tests/regression (golden/snapshot) and tests/migration (schema/data
  # migrations) were previously run manually only; both are mocked/fixture
  # based and need no GPU, PACS or model download. pytest exits 5 when a suite
  # collects nothing, so an empty selection fails the job loudly.
  test_regression:
    name: test-regression-migration (ubuntu-latest, 3.11)
    needs: [test_inventory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install system dependencies (Linux)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Run regression and migration suites
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run --no-sync pytest tests/regression/ tests/migration/ \
            -vv --tb=short --no-header --durations=10 \
            --junitxml=pytest-regression-junit.xml
      - name: Upload regression/migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-regression-migration
          path: pytest-regression-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # S3-01 (#310): cross-platform GUI smoke. The curated `gui_smoke` marker
  # subset (≥20 mainline scenarios — study tabs/open, linear caliper and area
  # contour measurement, doppler caliper, report export, layout and user
  # preferences, DICOM export dialog) runs on native Windows and macOS
  # runners with the default Qt platform plugin (windows/cocoa). The
  # collect-guard fails loudly if the marker ever selects fewer than 20
  # tests, so the smoke cannot silently shrink to nothing; keep marked tests
  # fast and self-contained (target: the whole job under ~15 minutes).
  test_gui_smoke:
    name: test-gui-smoke (${{ matrix.os }}, 3.11)
    needs: [test_inventory]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Collect guard (at least 20 gui_smoke tests)
        shell: bash
        run: |
          count=$(uv run --no-sync pytest tests/unit/ -m gui_smoke --collect-only -p no:warnings 2>/dev/null \
            | grep -c '::' || true)
          echo "gui_smoke selected: ${count} tests"
          if [ "${count}" -lt 20 ]; then
            echo "::error title=gui smoke::only ${count} tests selected by -m gui_smoke (need >= 20); mark more scenarios in tests/unit and keep this guard in sync"
            exit 1
          fi
      - name: Run GUI smoke (native Qt platform)
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          uv run --no-sync pytest tests/unit/ -m gui_smoke \
            -vv --tb=short --no-header --durations=15 \
            --junitxml=pytest-gui-smoke-junit.xml > pytest-smoke.log 2>&1
          status=$?
          cat pytest-smoke.log
          # Surface every failure as a check annotation: the raw job log is
          # not always retrievable through the API, annotations are (S3-01).
          if [ "$status" -ne 0 ]; then
            grep -E '^(FAILED|ERROR) ' pytest-smoke.log | head -40 \
              | while IFS= read -r line; do
                  printf '::error title=gui smoke (%s)::%s\n' "${{ matrix.os }}" "${line}"
                done
          fi
          exit "$status"
      - name: Upload GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-gui-smoke-${{ matrix.os }}
          path: pytest-gui-smoke-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # GUI stays a required gate, but runs concurrently with test_logic instead of
  # extending the single Linux job's critical path. Four process workers match
  # the standard hosted Ubuntu runner; each owns its own QApplication.
  #
  # The GUI suite is additionally split into 6 file shards (matrix). Qt widgets
  # created by MainWindow-grade tests are never reclaimed inside one process
  # (~180 MB retained per MainWindow: close()+deleteLater() alone does not
  # deliver DeferredDelete, and forced deletion segfaults in MainWindow.event
  # paths), so one process running the whole GUI set grows until the runner
  # OOM-kills a worker ("Not properly terminated", with pending tests silently
  # dropped). Shards bound per-process accumulation; every shard stays required.
  test_gui:
    name: test-gui (ubuntu-latest, 3.11, shard ${{ matrix.shard }}/6)
    needs: [test_inventory]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Qt is explicitly offscreen in the unit-test conftest; retain xvfb for
      # the GUI gate and for tests which still consult DISPLAY. Bound apt retries
      # so a stalled hosted-runner mirror cannot hold the check indefinitely.
      - name: Install system dependencies (Linux GUI)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11

      # The 300 ms preset-switch budget is a wall-clock assertion, and the
      # sharded run below saturates this runner with 4 Qt workers under Xvfb:
      # the very same code reads 330-460 ms there (CI observed 368/446/462 ms
      # against 300 ms), so the verdict depended on which shard the round-robin
      # file split placed the file in — adding one test file moved it from
      # shard 2 (always green) to shard 3 (red on main). Run it alone, before
      # the shards start, so the budget keeps meaning what it says. The name is
      # duplicated in the -k exclusion below; renaming the test fails here
      # loudly (nothing collected) instead of silently rejoining a shard.
      - name: Run timing-budget test in isolation (no xdist)
        if: matrix.shard == 0
        timeout-minutes: 6
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          QT_QPA_PLATFORM: offscreen
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          set +e
          xvfb-run -a uv run --no-sync pytest \
            "tests/unit/test_layout_v2_window.py::test_preset_switch_fits_the_300ms_budget" \
            -n0 --tb=line --no-header \
            --cov=src/echo_personal_tool --cov-report= --cov-append \
            > /tmp/pytest-timing.log 2>&1
          status=$?
          cat /tmp/pytest-timing.log
          python .github/scripts/annotate_pytest_failures.py /tmp/pytest-timing-node "$status" < /tmp/pytest-timing.log
          exit "$status"

      - name: Run GUI tests (Linux, shard ${{ matrix.shard }}/6)
        timeout-minutes: 25
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          QT_QPA_PLATFORM: offscreen
          PYTEST_CURRENT_NODE_FILE: /tmp/pytest-last-node
          PYTEST_CI_METRICS_FILE: /tmp/pytest-metrics.json
          PYTEST_JUNIT_FILE: /tmp/pytest-junit.xml
          PYTEST_LOG_FILE: /tmp/pytest.log
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
          GUI_SHARD: ${{ matrix.shard }}
          GUI_SHARD_COUNT: 6
        run: |
          set +e
          rm -f /tmp/pytest.log /tmp/pytest-last-node* /tmp/pytest-metrics.json /tmp/pytest-junit.xml
          # Deterministic file sharding: every tests/unit/test_*.py file belongs
          # to exactly one shard (sorted order, round-robin). The -m filter then
          # selects the GUI tests inside this shard's files; files without GUI
          # tests select nothing. New files are picked up automatically.
          mapfile -t unit_files < <(git ls-files 'tests/unit/test_*.py' | sort)
          if [ "${#unit_files[@]}" -eq 0 ]; then
            echo "::error title=GUI shard::no tests/unit/test_*.py files listed by git ls-files"
            exit 1
          fi
          shard_files=()
          for i in "${!unit_files[@]}"; do
            if [ "$((i % GUI_SHARD_COUNT))" -eq "$GUI_SHARD" ]; then
              shard_files+=("${unit_files[$i]}")
            fi
          done
          echo "GUI shard $GUI_SHARD/$GUI_SHARD_COUNT: ${#shard_files[@]} files"
          # Worker restarts stay enabled (default): a dead worker's pending tests
          # are rescheduled instead of silently dropped. The count gate below
          # turns any residual loss into a loud failure.
          # The timing-budget test is excluded here (see the isolation step
          # above): under this 4-worker load its wall-clock budget cannot be
          # trusted. The partition gate accounts for this one separately run
          # test, and coverage is appended from the isolated run on shard 0.
          # Run the selected GUI inventory once. A duplicate pass used to run
          # all Qt tests twice and consume the shard's 25-minute wall-clock budget.
          # Per-test limit 180 s instead of the repository default of 60 s:
          # four workers share the two vCPUs of a hosted runner, and a GUI test
          # that constructs a MainWindow — or changes the application
          # stylesheet, which re-polishes every widget the worker ever created —
          # crosses a minute under that contention. pytest-timeout kills the
          # whole worker when it fires, which then reads as "worker crashed",
          # fails the count gate and re-runs the victim's tests. The limit
          # still bounds a real hang.
          xvfb-run -a uv run --no-sync pytest "${shard_files[@]}" -n 4 --dist loadfile --max-worker-restart=2 \
            -vv -p pytest_current_node -p pytest_ci_metrics --tb=line --no-header \
            -m "gui and not interactive" --durations=25 -o timeout=180 \
            -k "not test_preset_switch_fits_the_300ms_budget" \
            --junitxml="$PYTEST_JUNIT_FILE" \
            --cov=src/echo_personal_tool --cov-report= --cov-append \
            > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          python .github/scripts/annotate_pytest_failures.py /tmp/pytest-last-node "$status" < /tmp/pytest.log
          python .github/scripts/check_pytest_counts.py \
            --junit /tmp/pytest-junit.xml --metrics /tmp/pytest-metrics.json
          count_status=$?
          if [ "$status" -ne 0 ] && [ -s /tmp/pytest-last-node ]; then
            printf '::error title=pytest recorded active node::%s\n' "$(head -n 1 /tmp/pytest-last-node)"
            printf '::error title=pytest abort::recorded active node (not proof of crash cause): %s\n' "$(head -n 1 /tmp/pytest-last-node)"
          fi
          if [ "$status" -ne 0 ] || [ "$count_status" -ne 0 ]; then
            exit 1
          fi
          exit 0

      - name: Surface GUI worker context after failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          nodes = []
          for path in sorted(Path("/tmp").glob("pytest-last-node-gw*")):
              node = path.read_text(encoding="utf-8", errors="replace").strip()
              if node:
                  nodes.append(f"{path.name}: {node}")
          log = Path("/tmp/pytest.log")
          tail = log.read_text(encoding="utf-8", errors="replace").splitlines()[-24:] if log.is_file() else []
          message = "\n".join([*nodes, "--- pytest tail ---", *tail])
          safe = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=GUI shard worker context::{safe[:60000]}")
          PY

      - name: Upload GUI test timings and inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-gui-diagnostics-shard-${{ matrix.shard }}
          path: |
            /tmp/pytest.log
            /tmp/pytest-metrics.json
            /tmp/pytest-junit.xml
            /tmp/pytest-last-node*
          if-no-files-found: ignore
          retention-days: 3

      - name: Stage GUI coverage data
        if: success()
        run: cp .coverage coverage-gui-shard-${{ matrix.shard }}.data

      - name: Upload GUI coverage data
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-gui-shard-${{ matrix.shard }}
          path: coverage-gui-shard-${{ matrix.shard }}.data
          retention-days: 1

  # Keep the performance SLO as an independent Linux check, so it runs beside
  # the unit jobs rather than after their long GUI suite.
  test_bench:
    name: test-bench (ubuntu-latest, 3.11)
    needs: [test_inventory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install system dependencies (Linux)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Run 720p cine playback bench (Linux)
        run: xvfb-run -a uv run --no-sync pytest tests/bench/test_cine_playback_e2e_ci.py -q --tb=short --no-header

  # Security suite (QH-2a.1 part 2, S-12). Everything under tests/security is
  # mocked — no PACS, no network, no model download — so it runs on every PR.
  # The job is green only when every node id listed in
  # .github/required-tests/security.txt was collected AND passed:
  # check_required_tests.py turns a skipped, xfailed, renamed or deleted
  # required test (and an empty or fully skipped selection) into a failure.
  test_security:
    name: test-security (ubuntu-latest, 3.11)
    needs: [test_inventory]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install system dependencies (Linux)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Run security tests
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          QT_QPA_PLATFORM: offscreen
          PYTEST_CURRENT_NODE_FILE: /tmp/pytest-last-node
          PYTEST_CI_METRICS_FILE: /tmp/pytest-metrics.json
          PYTEST_LOG_FILE: /tmp/pytest.log
        run: |
          set +e
          rm -f /tmp/pytest.log /tmp/pytest-last-node* /tmp/pytest-metrics.json /tmp/pytest-junit.xml
          uv run --no-sync pytest tests/security/ \
            -vv -p pytest_current_node -p pytest_ci_metrics --tb=short --no-header \
            -rsxX --durations=15 \
            --junitxml=/tmp/pytest-junit.xml \
            > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          python .github/scripts/annotate_pytest_failures.py /tmp/pytest-last-node "$status" < /tmp/pytest.log
          python .github/scripts/check_pytest_counts.py \
            --junit /tmp/pytest-junit.xml --metrics /tmp/pytest-metrics.json
          count_status=$?
          python .github/scripts/check_required_tests.py \
            --metrics /tmp/pytest-metrics.json \
            --required .github/required-tests/security.txt \
            --allowed-skips .github/required-tests/security-allowed-skips.txt
          required_status=$?
          if [ "$status" -ne 0 ] && [ -s /tmp/pytest-last-node ]; then
            printf '::error title=pytest recorded active node::%s\n' "$(head -n 1 /tmp/pytest-last-node)"
          fi
          if [ "$status" -ne 0 ] || [ "$count_status" -ne 0 ] || [ "$required_status" -ne 0 ]; then
            exit 1
          fi
          exit 0
      - name: Upload security test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-security-evidence
          path: |
            /tmp/pytest.log
            /tmp/pytest-metrics.json
            /tmp/pytest-junit.xml
            /tmp/pytest-last-node*
          if-no-files-found: ignore
          retention-days: 7

  # Acceptance workflows (QH-2a.1 part 2): the critical end-to-end scenarios
  # under tests/acceptance (portable profiles S-10, Orthanc/open/measure/export,
  # preferences, constructor, auto-segment, strain) run under Xvfb with the
  # offscreen Qt platform. The same required-tests gate applies with
  # .github/required-tests/acceptance.txt.
  test_acceptance:
    name: test-acceptance (ubuntu-latest, 3.11)
    needs: [test_inventory]
