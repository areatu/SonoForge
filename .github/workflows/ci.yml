          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          QT_QPA_PLATFORM: offscreen
          PYTEST_CURRENT_NODE_FILE: /tmp/pytest-last-node
          PYTEST_CI_METRICS_FILE: /tmp/pytest-metrics.json
          PYTEST_LOG_FILE: /tmp/pytest.log
        run: |
          set +e
          rm -f /tmp/pytest.log /tmp/pytest-last-node* /tmp/pytest-metrics.json /tmp/pytest-junit.xml
          xvfb-run -a uv run --no-sync pytest tests/acceptance/ \
            -vv -p pytest_current_node -p pytest_ci_metrics --tb=short --no-header \
            -rsxX --durations=15 \
            --junitxml=/tmp/pytest-junit.xml \
            > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          python .github/scripts/annotate_pytest_failures.py /tmp/pytest-last-node "$status" < /tmp/pytest.log
          python .github/scripts/check_pytest_counts.py \
            --junit /tmp/pytest-junit.xml --metrics /tmp/pytest-metrics.json
          count_status=$?
          python .github/scripts/check_required_tests.py \
