      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install system dependencies (Linux GUI)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
