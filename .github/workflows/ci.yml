name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "src")
          from echo_personal_tool import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")
          print(f"Release tag {tag} matches __version__")
          PY
      - run: pip install ruff==0.16.0
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # Linux logic, platform compatibility, GUI, and bench run independently.
  # The logic and GUI selections combine to the full unit-test coverage.
  test_logic:
    name: test-logic (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      # Preserve the Linux Qt runtime packages used by the former all-in-one
      # test job; only the GUI/bench commands consume xvfb itself.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1

      # PySide6 6.12.0 aborts during Linux QWidget teardown; keep CI on the
      # latest stable release until that upstream regression is resolved.
      - run: pip install -e ".[dev]" "PySide6!=6.12.0"

      # Linux preserves the repository's default exclusion of interactive tests
      # while selecting every non-GUI item. xdist gives each worker an isolated
      # Python/Qt state; loadfile keeps each module together and in file order.
      - name: Run logic tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          QT_QPA_PLATFORM: offscreen
          PYTEST_CURRENT_NODE_FILE: /tmp/pytest-last-node
          PYTEST_CI_METRICS_FILE: /tmp/pytest-metrics.json
          PYTEST_LOG_FILE: /tmp/pytest.log
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          set +e
          rm -f /tmp/pytest.log /tmp/pytest-last-node* /tmp/pytest-metrics.json
          pytest tests/unit/ -n auto --dist loadfile --max-worker-restart=0 \
            -vv -p pytest_current_node -p pytest_ci_metrics --tb=line --no-header \
            -m "not gui and not interactive" --durations=25 \
            --cov=src/echo_personal_tool --cov-report= \
            > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          python .github/scripts/annotate_pytest_failures.py /tmp/pytest-last-node "$status" < /tmp/pytest.log
          if [ "$status" -ne 0 ] && [ -s /tmp/pytest-last-node ]; then
            printf '::error title=pytest last test before exit::%s\n' "$(head -n 1 /tmp/pytest-last-node)"
            printf '::error title=pytest abort::last test before abort: %s\n' "$(head -n 1 /tmp/pytest-last-node)"
          fi
          exit "$status"

      - name: Upload logic test timings and inventory
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-logic-diagnostics
          path: |
            /tmp/pytest.log
            /tmp/pytest-metrics.json
            /tmp/pytest-last-node*
          if-no-files-found: ignore
          retention-days: 3

      - name: Stage logic coverage data
        if: success() && runner.os == 'Linux'
        run: cp .coverage coverage-logic.data

      - name: Upload logic coverage data
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-logic
          path: coverage-logic.data
          retention-days: 1

  # Keep the macOS/Windows platform-compatibility gate parallel to the Linux
  # coverage-producing job. Preserve the `not gui` filter and explicitly keep
  # the repository's interactive-test exclusion; report each worker's active node.
  test_compat:
    name: test-logic (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install -e ".[dev]" "PySide6!=6.12.0"
      - name: Run logic tests (macOS/Windows)
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          QT_QPA_PLATFORM: offscreen
          PYTEST_CURRENT_NODE_FILE: pytest-last-node
          PYTEST_CI_METRICS_FILE: pytest-metrics.json
          PYTEST_LOG_FILE: pytest.log
        run: |
          set +e
          rm -f pytest.log pytest-last-node* pytest-metrics.json
          pytest tests/unit/ -n auto --dist loadfile --max-worker-restart=0 \
            -vv -p pytest_current_node -p pytest_ci_metrics --tb=line --no-header \
            -m "not gui and not interactive" --durations=25 > pytest.log 2>&1
          status=$?
          cat pytest.log
          python .github/scripts/annotate_pytest_failures.py pytest-last-node "$status" < pytest.log
          if [ "$status" -ne 0 ] && [ -s pytest-last-node ]; then
            printf '::error title=pytest last test before exit::%s\n' "$(head -n 1 pytest-last-node)"
            printf '::error title=pytest abort::last test before abort: %s\n' "$(head -n 1 pytest-last-node)"
          fi
          exit "$status"
      - name: Upload platform logic diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-logic-diagnostics-${{ matrix.os }}
          path: |
            pytest.log
            pytest-metrics.json
            pytest-last-node*
          if-no-files-found: ignore
          retention-days: 3

  # GUI stays a required gate, but runs concurrently with test_logic instead of
  # extending the single Linux job's critical path. Four process workers match
  # the standard hosted Ubuntu runner; each owns its own QApplication.
  test_gui:
    name: test-gui (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      # Qt is explicitly offscreen in the unit-test conftest; retain xvfb for
      # the GUI gate and for tests which still consult DISPLAY. Bound apt retries
      # so a stalled hosted-runner mirror cannot hold the check indefinitely.
      - name: Install system dependencies (Linux GUI)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1

      # PySide6 6.12.0 has an upstream Linux teardown regression.
      - run: pip install -e ".[dev]" "PySide6!=6.12.0"

      - name: Run GUI tests (Linux)
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          QT_QPA_PLATFORM: offscreen
          PYTEST_CURRENT_NODE_FILE: /tmp/pytest-last-node
          PYTEST_CI_METRICS_FILE: /tmp/pytest-metrics.json
          PYTEST_LOG_FILE: /tmp/pytest.log
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          set +e
          rm -f /tmp/pytest.log /tmp/pytest-last-node* /tmp/pytest-metrics.json
          xvfb-run -a pytest tests/unit/ -n 4 --dist loadfile --max-worker-restart=0 \
            -vv -p pytest_current_node -p pytest_ci_metrics --tb=line --no-header \
            -m "gui and not interactive" --durations=25 \
            --cov=src/echo_personal_tool --cov-report= \
            > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          python .github/scripts/annotate_pytest_failures.py /tmp/pytest-last-node "$status" < /tmp/pytest.log
          if [ "$status" -ne 0 ] && [ -s /tmp/pytest-last-node ]; then
            printf '::error title=pytest last test before exit::%s\n' "$(head -n 1 /tmp/pytest-last-node)"
            printf '::error title=pytest abort::last test before abort: %s\n' "$(head -n 1 /tmp/pytest-last-node)"
          fi
          exit "$status"

      - name: Upload GUI test timings and inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-gui-diagnostics
          path: |
            /tmp/pytest.log
            /tmp/pytest-metrics.json
            /tmp/pytest-last-node*
          if-no-files-found: ignore
          retention-days: 3

      - name: Stage GUI coverage data
        if: success()
        run: cp .coverage coverage-gui.data

      - name: Upload GUI coverage data
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-gui
          path: coverage-gui.data
          retention-days: 1

  # Keep the performance SLO as an independent Linux check, so it runs beside
  # the unit jobs rather than after their long GUI suite.
  test_bench:
    name: test-bench (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install system dependencies (Linux)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1
      - run: pip install -e ".[dev]" "PySide6!=6.12.0"
      - name: Run 720p cine playback bench (Linux)
        run: xvfb-run -a pytest tests/bench/test_cine_playback_e2e_ci.py -q --tb=short --no-header

  # Existing required status-check names are preserved by the test matrix below.
  # These lightweight jobs become green only after every new suite and coverage
  # report succeeds, so branch protection does not silently lose the GUI gate.
  coverage:
    name: Combined Linux coverage
    runs-on: ubuntu-latest
    needs: [test_logic, test_gui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: pip install "coverage>=7,<8"
      - uses: actions/download-artifact@v4
        with:
          name: coverage-data-logic
          path: coverage-input/logic
      - uses: actions/download-artifact@v4
        with:
          name: coverage-data-gui
          path: coverage-input/gui
      - uses: actions/download-artifact@v4
        with:
          name: pytest-logic-diagnostics
          path: coverage-input/metrics-logic
      - uses: actions/download-artifact@v4
        with:
          name: pytest-gui-diagnostics
          path: coverage-input/metrics-gui
      - name: Verify split test inventory and combine coverage
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          python .github/scripts/verify_pytest_partition.py \
            --logic coverage-input/metrics-logic/pytest-metrics.json \
            --gui coverage-input/metrics-gui/pytest-metrics.json
          mkdir -p coverage-input/data
          cp coverage-input/logic/coverage-logic.data coverage-input/data/.coverage.logic
          cp coverage-input/gui/coverage-gui.data coverage-input/data/.coverage.gui
          coverage combine coverage-input/data
          coverage report
          coverage xml -o coverage.xml
          coverage html -d htmlcov
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          flag-name: unittests

  # The old matrix check remains in branch protection. Make each cell an
  # aggregate of all parallel jobs, rather than replacing it with a weaker gate.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [test_logic, test_compat, test_gui, test_bench, coverage]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Require every test and coverage gate
        shell: bash
        env:
          LOGIC_RESULT: ${{ needs.test_logic.result }}
          COMPAT_RESULT: ${{ needs.test_compat.result }}
          GUI_RESULT: ${{ needs.test_gui.result }}
          BENCH_RESULT: ${{ needs.test_bench.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [[ "$LOGIC_RESULT" != "success" || "$COMPAT_RESULT" != "success" \
            || "$GUI_RESULT" != "success" || "$BENCH_RESULT" != "success" \
            || "$COVERAGE_RESULT" != "success" ]]; then
            echo "::error title=CI test gate::logic=$LOGIC_RESULT compat=$COMPAT_RESULT gui=$GUI_RESULT bench=$BENCH_RESULT coverage=$COVERAGE_RESULT"
            exit 1
          fi
          echo "All logic, platform compatibility, GUI, benchmark, and coverage gates passed."

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install hatch
      - run: hatch build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # PyPI trusted publishing must be configured first (project + publisher).
        # Gate on a repository variable so an unconfigured PyPI does not turn a
        # release tag red; set vars.PYPI_PUBLISH=true to enable uploading.
        if: vars.PYPI_PUBLISH == 'true'
        with:
          skip-existing: true
