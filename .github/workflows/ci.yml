name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-linux-log:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pytest-linux-log
          path: downloaded-log
          run-id: 38040356649
          github-token: ${{ github.token }}
      - name: Publish the crash window
        run: |
          python3 - << 'PY'
          import pathlib
          root = pathlib.Path("downloaded-log")
          files = [path for path in root.rglob("*") if path.is_file()]
          log_path = max(files, key=lambda path: path.stat().st_size)
          lines = log_path.read_text(errors="replace").splitlines()
          markers = ("Fatal Python error", "Segmentation fault", "Current thread", "Timeout")
          idx = next((i for i, line in enumerate(lines) if any(token in line for token in markers)), None)
          if idx is None:
              chosen = lines[-10:]
          else:
              chosen = lines[max(0, idx - 8) : idx + 2]
          last_node = ""
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("tests/") and "::" in stripped:
                  last_node = stripped.split()[0]
          print(f"::error title=pytest last node::{last_node[:700]}")
          for index, line in enumerate(chosen[:9]):
              safe = line.replace("%", "%25").replace("\r", "")[:700]
              print(f"::error title=crash {index}::{safe}")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "src")
          from echo_personal_tool import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")
          print(f"Release tag {tag} matches __version__")
          PY
      - run: pip install ruff==0.16.0
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Linux: install display server for headless Qt
      # Hosted ubuntu runners occasionally hang in apt (stalled mirror or a
      # dpkg lock) with no output; bound every attempt and retry instead of
      # holding the PR check until the 6-hour job limit.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1

      # PySide6 6.12.0 aborts during Linux QWidget teardown; keep CI on the
      # latest stable release until that upstream regression is resolved.
      - run: pip install -e ".[dev]" "PySide6!=6.12.0"

      # Linux: run with a virtual display. Verbose node IDs plus the annotation
      # filter keep test failures and native abort locations readable through
      # the check-run REST API even when job logs are not downloadable.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # GitHub's default bash is `-e -o pipefail`: without `set +e` a
          # non-zero pytest exit (pytest-timeout's os._exit(1) on a hang
          # included) would kill this script before the diagnostics below.
          set +e
          export PYTHONFAULTHANDLER=1
          export PYTHONUNBUFFERED=1
          # addopts starts at -q, which cancels a single -v. -vv nets to verbose
          # node ids, and the plugin flushes the current node before each test
          # so a pytest-timeout os._exit still leaves a name on disk.
          export PYTHONPATH="${PWD}/.github/scripts${PYTHONPATH:+:$PYTHONPATH}"
          xvfb-run -a pytest tests/unit/ -vv -p pytest_current_node --tb=line --no-header --cov=src/echo_personal_tool --cov-report=xml --cov-report=html:htmlcov \
            > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          python .github/scripts/annotate_pytest_failures.py /tmp/pytest-last-node "$status" < /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            # A hang (pytest-timeout thread method calls os._exit(1)) or an
            # INTERNALERROR dies without any FAILED summary lines, leaving the
            # annotator nothing to publish. Surface the last test node and the
            # tail of the verbose log as annotations so the blocking test is
            # identifiable from the checks API even when job logs are not
            # downloadable.
            if [ -f /tmp/pytest-last-node ]; then
              printf '::error title=pytest abort::last test before abort: %s\n' "$(head -n 1 /tmp/pytest-last-node)"
            fi
          fi
          exit "$status"

      - name: Upload pytest log (failure diagnostics)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-linux-log
          path: /tmp/pytest.log
          retention-days: 7
      # Linux CI is the single coverage producer/uploader; no separate coverage workflow.
      - name: Upload coverage report artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

      - name: Upload coverage to Coveralls
        if: runner.os == 'Linux'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          flag-name: unittests

      # macOS/Windows: run without GUI tests (no xvfb available). Use the same
      # annotation filter as Linux so failing test names are available in checks.
      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          pytest tests/unit/ -q --tb=line --no-header -m "not gui" \
            | python .github/scripts/annotate_pytest_failures.py

      # Linux: end-to-end 720p cine playback SLOs (real AppController + ViewerWidget,
      # offscreen). Kept out of tests/unit/ on purpose: it plays two synthetic cines for
      # 4 s each, and the thresholds in the module are the acceptance criteria from
      # docs/bench/2026-09-06-cine-720p-playback-audit.md section 4.3.
      - name: Run 720p cine playback bench (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/bench/test_cine_playback_e2e_ci.py -q --tb=short --no-header

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install hatch
      - run: hatch build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
