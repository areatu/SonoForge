name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "src")
          from echo_personal_tool import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} does not match package version {expected!r}")
          print(f"Release tag {tag} matches __version__")
          PY
      - run: pip install ruff==0.16.0
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Linux: install display server for headless Qt
      # Hosted ubuntu runners occasionally hang in apt (stalled mirror or a
      # dpkg lock) with no output; bound every attempt and retry instead of
      # holding the PR check until the 6-hour job limit.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                xvfb libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1

      - run: pip install -e ".[dev]" "PySide6!=6.12.0"

      # Linux: run with a virtual display. Verbose node IDs plus the annotation
      # filter keep test failures and native abort locations readable through
      # the check-run REST API even when job logs are not downloadable.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # GitHub's default bash is `-e -o pipefail`: without `set +e` a
          # non-zero pytest exit (pytest-timeout's os._exit(1) on a hang
          # included) would kill this script before the diagnostics below.
          set +e
          export PYTHONFAULTHANDLER=1
          xvfb-run -a pytest tests/unit/ -v --tb=line --no-header --cov=src/echo_personal_tool --cov-report=xml --cov-report=html:htmlcov \
            > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          python .github/scripts/annotate_pytest_failures.py < /tmp/pytest.log
          if [ "$status" -ne 0 ]; then
            # A hang (pytest-timeout thread method calls os._exit(1)) or an
            # INTERNALERROR dies without any FAILED summary lines, leaving the
            # annotator nothing to publish. Surface the tail of the verbose
            # log as annotations so the blocking test is identifiable from
            # the checks API even when job logs are not downloadable.
            tail -n 10 /tmp/pytest.log | while IFS= read -r line; do
              printf '::error title=pytest tail::%s\n' "${line:0:1500}"
            done
          fi
          exit "$status"

      - name: Upload pytest log (failure diagnostics)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-linux-log
          path: /tmp/pytest.log
          retention-days: 7

          set -euo pipefail
          last_node_file="$RUNNER_TEMP/pytest-last-node.txt"
          last_tail_file="${last_node_file}.tail"
          rm -f "$last_node_file" "$last_tail_file"
          set +e
          xvfb-run -a pytest tests/unit/ -vv --tb=line --no-header --cov=src/echo_personal_tool --cov-report=xml --cov-report=html:htmlcov 2>&1 \
            | python .github/scripts/annotate_pytest_failures.py "$last_node_file"
          statuses=("${PIPESTATUS[@]}")
          set -e
          pytest_status="${statuses[0]}"
          filter_status="${statuses[1]}"
          if (( pytest_status != 0 )); then
            last_node="(no pytest node was reported)"
            if [[ -s "$last_node_file" ]]; then
              last_node="$(cat "$last_node_file")"
            fi
            if [[ -s "$last_tail_file" ]]; then
              tail_output="$(tail -n 12 "$last_tail_file" | tr -d '\r' | tr '\n' ' ' | cut -c1-1200)"
              echo "::error title=pytest process exit ${pytest_status}::Last pytest node: ${last_node}; output tail: ${tail_output}"
            else
              echo "::error title=pytest process exit ${pytest_status}::Last pytest node reached: ${last_node}"
            fi
            exit "$pytest_status"
          fi
          exit "$filter_status"

      # Linux CI is the single coverage producer/uploader; no separate coverage workflow.
      - name: Upload coverage report artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

      - name: Upload coverage to Coveralls
        if: runner.os == 'Linux'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          flag-name: unittests

      # macOS/Windows: run without GUI tests (no xvfb available). Use the same
      # annotation filter as Linux so failing test names are available in checks.
      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          pytest tests/unit/ -q --tb=line --no-header -m "not gui" \
            | python .github/scripts/annotate_pytest_failures.py

      # Linux: end-to-end 720p cine playback SLOs (real AppController + ViewerWidget,
      # offscreen). Kept out of tests/unit/ on purpose: it plays two synthetic cines for
      # 4 s each, and the thresholds in the module are the acceptance criteria from
      # docs/bench/2026-09-06-cine-720p-playback-audit.md section 4.3.
      - name: Run 720p cine playback bench (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/bench/test_cine_playback_e2e_ci.py -q --tb=short --no-header

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install hatch
      - run: hatch build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
