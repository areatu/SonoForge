            --required .github/required-tests/acceptance.txt
          required_status=$?
          if [ "$status" -ne 0 ] && [ -s /tmp/pytest-last-node ]; then
            printf '::error title=pytest recorded active node::%s\n' "$(head -n 1 /tmp/pytest-last-node)"
          fi
          if [ "$status" -ne 0 ] || [ "$count_status" -ne 0 ] || [ "$required_status" -ne 0 ]; then
            exit 1
          fi
          exit 0
      - name: Upload acceptance test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-acceptance-evidence
          path: |
            /tmp/pytest.log
            /tmp/pytest-metrics.json
            /tmp/pytest-junit.xml
            /tmp/pytest-last-node*
          if-no-files-found: ignore
          retention-days: 7

  # UI-0 PR-1: the colour ratchet and the contrast check of the design tokens.
  # Both scripts read the token package, which has no Qt import, so the job
  # needs nothing but the interpreter. The ratchet fails when a raw colour
  # literal appears outside the palette module; the contrast check fails when
  # a pair of graphite tokens misses the WCAG 2.1 AA minimum.
  ui_colors:
    name: ui-colors (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Colour ratchet (raw literals outside the palette module)
        run: python scripts/check_ui_colors.py
      - name: Contrast of the design tokens (WCAG 2.1 AA)
        run: python scripts/check_contrast.py

  # QH-5a: the packaged-artifact scenario (first launch -> synthetic cine ->
  # measurement save -> restart in a second process -> text/PDF export ->
  # portable-storage boundaries). Running it here keeps the scenario itself
  # required on every PR; build.yml and release.yml run the same scenario
  # against the real packages (A-16 needs the artifact, this job needs the
  # scenario to be alive and honest).
  package_smoke:
    name: package-smoke (ubuntu-latest, 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Qt runtime for the offscreen platform plugin used by the report fonts.
      - name: Install system dependencies (Linux)
        timeout-minutes: 16
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get $apt_opts update \
              && sudo timeout 180 apt-get $apt_opts install -y \
                libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libegl1; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sleep 10
          done
          exit 1
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Package smoke (source runner, full profile)
        run: |
          uv run --no-sync python tools/release/run_package_smoke.py \
            --runner module --profile full --workdir package-smoke \
            --evidence package-smoke-evidence.json
      - name: Check the release tooling against the matrix
        run: |
          uv run --no-sync python tools/release/presenter_pins.py
          uv run --no-sync python .github/scripts/locked_version.py pyinstaller >/dev/null
      - name: Upload package smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-smoke-evidence
          path: package-smoke-evidence.json
          if-no-files-found: ignore
          retention-days: 7

  # Existing required status-check names are preserved by the test matrix below.
  # These lightweight jobs become green only after every new suite and coverage
  # report succeeds, so branch protection does not silently lose the GUI gate.
  coverage:
    name: Combined Linux coverage
    runs-on: ubuntu-latest
    needs: [test_logic, test_gui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the locked coverage
        run: pip install "coverage==$(python .github/scripts/locked_version.py coverage)"
      # Keep each named artifact in its own directory for coverage combine.
      # Pin the patched download action to an explicit release.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data-logic
          path: coverage-input/logic
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data-gui-shard-0
          path: coverage-input/gui-0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data-gui-shard-1
          path: coverage-input/gui-1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data-gui-shard-2
          path: coverage-input/gui-2
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data-gui-shard-3
          path: coverage-input/gui-3
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data-gui-shard-4
          path: coverage-input/gui-4
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-data-gui-shard-5
          path: coverage-input/gui-5
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pytest-logic-diagnostics
          path: coverage-input/metrics-logic
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pytest-gui-diagnostics-shard-0
          path: coverage-input/metrics-gui-0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pytest-gui-diagnostics-shard-1
          path: coverage-input/metrics-gui-1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pytest-gui-diagnostics-shard-2
          path: coverage-input/metrics-gui-2
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pytest-gui-diagnostics-shard-3
          path: coverage-input/metrics-gui-3
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pytest-gui-diagnostics-shard-4
          path: coverage-input/metrics-gui-4
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pytest-gui-diagnostics-shard-5
          path: coverage-input/metrics-gui-5
      - name: Verify split test inventory and combine coverage
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: |
          python .github/scripts/verify_pytest_partition.py \
            --logic coverage-input/metrics-logic/pytest-metrics.json \
            --gui coverage-input/metrics-gui-0/pytest-metrics.json \
                  coverage-input/metrics-gui-1/pytest-metrics.json \
                  coverage-input/metrics-gui-2/pytest-metrics.json \
                  coverage-input/metrics-gui-3/pytest-metrics.json \
                  coverage-input/metrics-gui-4/pytest-metrics.json \
                  coverage-input/metrics-gui-5/pytest-metrics.json
          mkdir -p coverage-input/data
          cp coverage-input/logic/coverage-logic.data coverage-input/data/.coverage.logic
          cp coverage-input/gui-0/coverage-gui-shard-0.data coverage-input/data/.coverage.gui0
          cp coverage-input/gui-1/coverage-gui-shard-1.data coverage-input/data/.coverage.gui1
          cp coverage-input/gui-2/coverage-gui-shard-2.data coverage-input/data/.coverage.gui2
          cp coverage-input/gui-3/coverage-gui-shard-3.data coverage-input/data/.coverage.gui3
          cp coverage-input/gui-4/coverage-gui-shard-4.data coverage-input/data/.coverage.gui4
          cp coverage-input/gui-5/coverage-gui-shard-5.data coverage-input/data/.coverage.gui5
          coverage combine coverage-input/data
          # Ratchet from the measured 2026-10-23 baseline: overall 82.65%,
          # domain 90.40% (62871/76073 and 14426/15958). Thresholds sit a
          # couple of points below the measured values so an unrelated change
          # cannot go red, but a real coverage drop still fails the gate.
          coverage report --fail-under=80
          coverage report --include='src/echo_personal_tool/domain/*' --fail-under=88
          coverage xml -o coverage.xml
          coverage html -d htmlcov
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          flag-name: unittests

  # The old matrix check remains in branch protection. Make each cell an
  # aggregate of all parallel jobs, rather than replacing it with a weaker gate.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [test_logic, test_compat, test_gui, test_bench, test_security, security_audit, test_acceptance, ui_colors, package_smoke, coverage]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Require every test and coverage gate
        shell: bash
        env:
          LOGIC_RESULT: ${{ needs.test_logic.result }}
          COMPAT_RESULT: ${{ needs.test_compat.result }}
          GUI_RESULT: ${{ needs.test_gui.result }}
          BENCH_RESULT: ${{ needs.test_bench.result }}
          SECURITY_RESULT: ${{ needs.test_security.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security_audit.result }}
          ACCEPTANCE_RESULT: ${{ needs.test_acceptance.result }}
          UI_COLORS_RESULT: ${{ needs.ui_colors.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package_smoke.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [[ "$LOGIC_RESULT" != "success" || "$COMPAT_RESULT" != "success" \
            || "$GUI_RESULT" != "success" || "$BENCH_RESULT" != "success" \
            || "$SECURITY_RESULT" != "success" || "$SECURITY_AUDIT_RESULT" != "success" \
            || "$ACCEPTANCE_RESULT" != "success" \
            || "$UI_COLORS_RESULT" != "success" \
            || "$PACKAGE_SMOKE_RESULT" != "success" \
            || "$COVERAGE_RESULT" != "success" ]]; then
            echo "::error title=CI test gate::logic=$LOGIC_RESULT compat=$COMPAT_RESULT gui=$GUI_RESULT bench=$BENCH_RESULT security=$SECURITY_RESULT security_audit=$SECURITY_AUDIT_RESULT acceptance=$ACCEPTANCE_RESULT ui_colors=$UI_COLORS_RESULT package_smoke=$PACKAGE_SMOKE_RESULT coverage=$COVERAGE_RESULT"
            exit 1
          fi
          echo "All logic, platform compatibility (macOS/Windows on the requires-python floor), GUI, benchmark, security, security-audit, acceptance, colour-ratchet, package-smoke, and coverage gates passed."

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # QH-5a: the build backend comes from uv.lock like every other tool.
      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build wheel and sdist with the locked toolchain
        run: |
          uv sync --locked --extra build --python 3.11
          uv run --no-sync python -m hatchling build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # PyPI trusted publishing must be configured first (project + publisher).
        # Gate on a repository variable so an unconfigured PyPI does not turn a
        # release tag red; set vars.PYPI_PUBLISH=true to enable uploading.
        if: vars.PYPI_PUBLISH == 'true'
        with:
          skip-existing: true
