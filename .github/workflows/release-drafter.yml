name: Release Drafter

on:
  push:
    branches: [main]
  # No `pull_request` trigger: on pull_request events Release Drafter runs
  # against the ephemeral refs/pull/N/merge, which stops resolving once the PR
  # is merged and fails with "did not resolve to a commit". The draft is kept
  # current on pushes to main.

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
