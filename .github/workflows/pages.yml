# Project website on GitHub Pages: https://areatu.github.io/SonoForge/
#
# Built from site/, assets/presenter.png and docs/images/release-0.4/.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (instead of "Deploy from a branch"). Nothing else to configure.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "docs/images/release-0.4/**"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - "changelog/**"
      - "src/echo_personal_tool/__init__.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install ImageMagick for thumbnails
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends imagemagick

      - name: Check landing page, feature assets and citation
        run: python3 -m unittest discover -s site/tests -v

      - name: Assemble _site
        run: bash site/build.sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5