name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Check for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Qt for Python ships the upstream triple license (LGPL-3.0-only OR
          # GPL-2.0-only OR GPL-3.0-only) on every PyPI package; the LGPL branch
          # is the one we use. Exempt them from the GPL deny-list so a version
          # pin (e.g. pyside6<6.12) does not fail the check as a "changed" dep.
          # Entries are package-URLs (pkg:pypi/<name>), not bare names.
          allow-dependencies-licenses: pkg:pypi/pyside6,pkg:pypi/pyside6-essentials,pkg:pypi/pyside6-addons,pkg:pypi/shiboken6
          deny-licenses: GPL-3.0, AGPL-3.0
          # GHSA-v4x8-3wr5-3wq8 (filelock, CVE-2026-112940, high): dev-only via
          # `safety`, never shipped; the fix needs filelock 4.2.1, which
          # safety 3.8.1 cannot resolve to. Accepted exception with the
          # revisit trigger recorded in SECURITY.md ("Dependency contours");
          # drop this entry as soon as the lock reaches filelock>=4.2.1.
          allow-ghsas: GHSA-8mgp-746c-j5xp,GHSA-v4x8-3wr5-3wq8
