[project]
name = "sonoforge"
dynamic = ["version"]
description = "Personal desktop echocardiography analysis tool"
readme = "README.md"
license = "GPL-3.0-only"
# Lower bound raised 3.10 -> 3.11 (2026-10-22): Pillow 13.0.0 — the only
# release fixing the 2026-10-20/21 image-parsing advisories (CVE-2026-112390 …
# CVE-2026-112901, GHSA-p4wg-p73j-c528 and 23 more) — requires CPython >=3.11,
# and a universal lock therefore had to keep the vulnerable Pillow 12.3.0 for
# the 3.10 fork. CPython 3.10 itself left upstream support in October 2026.
# Narrowing the range is an explicit decision (QH spec 2026-10-13 §"Toolchain":
# "сокращение диапазона — отдельное явное решение, не скрытое следствие lock"),
# recorded in docs/reviews/2026-10-22-dependabot-alerts-ru.md.
# Widened 3.11-only -> 3.11–3.13 (2026-10-31, S3-02 / #311): numpy>=2.1 ships
# wheels for 3.11–3.13, so the 3.12/3.13 interpreters no longer force source
# builds; 3.11 stays the CI-primary interpreter and the packaging floor.
requires-python = ">=3.11,<3.14"
dependencies = [
    # 6.12.0 (2026-10-08) aborts the process at interpreter shutdown after
    # QApplication usage ("Fatal Python error: bool_dealloc" during GC
    # finalization) — kills the ubuntu CI job with SIGABRT (exit 134) even
    # when every test passed. 6.11.x is field-proven; revisit when fixed.
    "pyside6>=6.6,<6.12",
    "pyqtgraph>=0.13",
    "pydicom>=3.0",
    "pylibjpeg>=2.0",
    "pylibjpeg-openjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.0",
    # numpy 2.1+ is the first line with CPython 3.13 wheels; 2.x removed the
    # legacy aliases (np.float_, np.trapz, np.product, np.in1d) and changed
    # scalar promotion (NEP 50) — S3-02 / #311 migrated the code and re-ran
    # the STE/phantom baselines under it.
    "numpy>=2.1,<3",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "httpx>=0.27",
    "psutil>=5.9",
    "pymupdf>=1.24",
    "pynetdicom>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "onnxruntime>=1.17",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "keyring>=25.0",
]

[project.optional-dependencies]
presenter = [
    # Encrypted portable secret store (Fernet) for the SonoForge Presenter
    # build; the full profile uses the OS keychain via `keyring` instead.
    "cryptography>=44,<51",
]
# Build/release toolchain (QH-5a). Every packaging job installs these from
# uv.lock instead of a floating `pip install pyinstaller` / `pip install
# cyclonedx-bom`, so the artifact is produced by the same tested versions the
# lock records and `uv lock --check` guards.
build = [
    "pyinstaller>=6.10",
    "pyinstaller-hooks-contrib>=2024.8",
    "cyclonedx-bom==7.5.0",
    "hatchling>=1.25",
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.6",
    "coveralls>=4.0",
    "ruff>=0.4",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "bandit>=1.7",
    "syrupy>=4.0",
    "hypothesis>=6.0",
    "pip-audit>=2.10.1",
]

[project.scripts]
sonoforge = "echo_personal_tool.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/echo_personal_tool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_personal_tool"]

[tool.hatch.build.targets.wheel.force-include]

[tool.hatch.build.targets.sdist]
include = ["src/echo_personal_tool", "README.md"]

[tool.coverage.run]
source = ["src/echo_personal_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring real DICOM files on disk or live Orthanc (ECHO_ORTHANC=1)",
    "interactive: manual cine segmentation diagnostics (MP4 without DICOM tags)",
    "gui: tests requiring PySide6 QApplication (CI: skip with -m 'not gui')",
    "gui_smoke: curated cross-platform GUI smoke scenarios for the Windows/macOS test-gui-smoke CI job (subset of gui; keep fast and self-contained)",
    "real_webengine: GUI tests that must build a real QWebEngineView (opt out of the unit-test web stub)",
    "acceptance: end-to-end user workflow tests (mocked backends; required CI job test-acceptance)",
    "security: fuzzing, anonymisation, TLS/timeout and credential tests (mocked; required CI job test-security)",
    "regression: snapshot and golden-file regression tests",
    "migration: data migration and schema versioning tests",
    "system: black-box tests against installed application (ECHO_SYSTEM=1)",
    "compat: OS and platform compatibility tests (ECHO_COMPAT=1)",
    "bench: performance benchmarks (ECHO_BENCH=1)",
]
addopts = "-q -m 'not interactive'"
# S1-04 (audit 2026-10-22 §13): every `xfail` is strict, so an unexpected pass
# fails the run instead of silently turning into a permanently green test.
xfail_strict = true
timeout = 60
timeout_method = "thread"
filterwarnings = [
    # domain за строгим контролем: любое новое DeprecationWarning в доменной
    # логике останавливает прогон (п. 1 issue #330, аудит §5.3).
    "error::DeprecationWarning:echo_personal_tool.domain",
    # адресные подачи для известных шумных сторонних библиотек; добавлять по
    # мере выявления реальных источников при переезде на numpy 2 / Python 3.12.
    # S3-02 (#311): строка для numpy снята — под numpy 2.x предупреждений нет
    # (проверено прогоном без фильтров).
    "ignore::DeprecationWarning:PySide6",
    "ignore::DeprecationWarning:scipy",
    "ignore::DeprecationWarning:pydicom",
    "ignore::DeprecationWarning:cv2",
    "ignore::DeprecationWarning:PIL",
    "ignore::DeprecationWarning:reportlab",
    "ignore::DeprecationWarning:openpyxl",
    "ignore::DeprecationWarning:onnxruntime",
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:psutil",
    "ignore::DeprecationWarning:keyring",
    "ignore::DeprecationWarning:pylibjpeg",
    "ignore::DeprecationWarning:pynetdicom",
    "ignore::DeprecationWarning:shiboken6",
]

[tool.pytest-benchmark]
autosave = true
min_rounds = 5
calibration_precision = 100
save = "bench"
sort = "mean"
compare = "mean"
name = "ECHO2026"
group_by = "group"
timer = "time.perf_counter"

[tool.ruff]
line-length = 120
# Deliberately one step behind `requires-python`: at `py311` ruff's UP017 fires
# on the 24 `timezone.utc` sites that the 3.10 floor pinned down, and migrating
# them to `datetime.UTC` (plus `enum.StrEnum` in `measurement_action.py`) is a
# readability refactor, not a security fix. Bump this together with that pass.
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S110", "T201"]
ignore = ["E402", "E501", "UP042", "E741"]

[tool.ruff.lint.per-file-ignores]
# Tests and intentionally user-facing CLI scripts use print for their output.
"tests/**/*.py" = ["T201"]
# The packaged-artifact smoke is a CLI: its `save`/`restart`/`compare` stages are
# driven by the workflows and print a PASS/FAIL line per check (QH-5a).
"src/echo_personal_tool/application/package_smoke.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
files = [
    "src/echo_personal_tool/domain",
    "src/echo_personal_tool/imaging",
    "src/echo_personal_tool/application",
    "src/echo_personal_tool/infrastructure",
]
strict = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "onnxruntime",
    "onnxruntime.*",
    "scipy",
    "scipy.*",
    "PySide6",
    "PySide6.*",
    "pyqtgraph",
    "pyqtgraph.*",
    "pydicom",
    "pydicom.*",
    "pylibjpeg",
    "pylibjpeg.*",
    "pynetdicom",
    "pynetdicom.*",
    "httpx",
    "httpx.*",
    "psutil",
    "psutil.*",
    "reportlab",
    "reportlab.*",
    "openpyxl",
    "openpyxl.*",
    "keyring",
    "keyring.*",
    "PIL",
    "PIL.*",
    "shiboken6",
    "shiboken6.*",
    # #325: both are real runtime dependencies the lint job does not install,
    # and `check_untyped_defs` now looks inside the bodies that import them.
    "cryptography",
    "cryptography.*",
    "openjpeg",
    "openjpeg.*",
]
ignore_missing_imports = true

# #325: the lint job deliberately installs only the packages whose stubs decide
# whether `warn_unused_ignores` and `attr-defined` fire (PySide6, numpy, opencv,
# pydicom, PyYAML). Everything else is `skip` here so a developer with the full
# runtime closure and the minimal CI job get the *same* answer: these libraries
# stay ``Any`` in both, instead of being checked on one machine and invisible on
# the other.
[[tool.mypy.overrides]]
module = [
    "onnxruntime",
    "onnxruntime.*",
    "scipy",
    "scipy.*",
    "pyqtgraph",
    "pyqtgraph.*",
    "pylibjpeg",
    "pylibjpeg.*",
    "libjpeg",
    "libjpeg.*",
    "openjpeg",
    "openjpeg.*",
    "pynetdicom",
    "pynetdicom.*",
    "httpx",
    "httpx.*",
    "psutil",
    "psutil.*",
    "reportlab",
    "reportlab.*",
    "openpyxl",
    "openpyxl.*",
    "keyring",
    "keyring.*",
    "cryptography",
    "cryptography.*",
    "PIL",
    "PIL.*",
]
follow_imports = "skip"
ignore_missing_imports = true

# S2-05 (#309): the intermediate ignore_errors override for
# echo_personal_tool.keyboard_shortcuts was dropped — the module passes strict
# via transitive imports.
#
# #325 is closed: `application` and `infrastructure` are under the same
# `strict = true` as `domain` and `imaging`, with no per-package override left.
# The slices removed, in order: `warn_unused_ignores` + `check_untyped_defs`
# (9 + 33 dead suppressions, 2 real annotations); `misc`/`untyped-decorator`
# (one documented reportlab suppression, one `ParamSpec`); `attr-defined`
# (39 findings, mostly code that could not work — Qt 6 has no
# `QOpenGLContext.destroy`, `dicom_tag_dictionary` injected its constants with
# `globals()`, pynetdicom and OpenCV surfaces went unchecked); the two
# `disallow_untyped_*` flags (117 annotations in 30 files); and finally
# `warn_return_any` + `disallow_untyped_calls` (25 `no-any-return` findings, 8 of
# them on libraries that stay `follow_imports = "skip"` and therefore need an
# explicit `cast` at the boundary).
#
# Nothing is relaxed per package any more, so the two overrides that carried
# these knobs are gone. A future loosening has to be written next to
# `strict = true` and is caught by `tests/unit/test_type_ignore_ratchet.py`.

