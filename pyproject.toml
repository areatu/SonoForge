[project]
name = "sonoforge"
dynamic = ["version"]
description = "Personal desktop echocardiography analysis tool"
readme = "README.md"
license = "GPL-3.0-only"
# Lower bound raised 3.10 -> 3.11 (2026-10-22): Pillow 13.0.0 — the only
# release fixing the 2026-10-20/21 image-parsing advisories (CVE-2026-112390 …
# CVE-2026-112901, GHSA-p4wg-p73j-c528 and 23 more) — requires CPython >=3.11,
# and a universal lock therefore had to keep the vulnerable Pillow 12.3.0 for
# the 3.10 fork. CPython 3.10 itself left upstream support in October 2026.
# Narrowing the range is an explicit decision (QH spec 2026-10-13 §"Toolchain":
# "сокращение диапазона — отдельное явное решение, не скрытое следствие lock"),
# recorded in docs/reviews/2026-10-22-dependabot-alerts-ru.md.
requires-python = ">=3.11,<3.12"
dependencies = [
    # 6.12.0 (2026-10-08) aborts the process at interpreter shutdown after
    # QApplication usage ("Fatal Python error: bool_dealloc" during GC
    # finalization) — kills the ubuntu CI job with SIGABRT (exit 134) even
    # when every test passed. 6.11.x is field-proven; revisit when fixed.
    "pyside6>=6.6,<6.12",
    "pyqtgraph>=0.13",
    "pydicom>=3.0",
    "pylibjpeg>=2.0",
    "pylibjpeg-openjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "httpx>=0.27",
    "psutil>=5.9",
    "pymupdf>=1.24",
    "pynetdicom>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "onnxruntime>=1.17",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "keyring>=25.0",
]

[project.optional-dependencies]
presenter = [
    # Encrypted portable secret store (Fernet) for the SonoForge Presenter
    # build; the full profile uses the OS keychain via `keyring` instead.
    "cryptography>=44,<51",
]
# Build/release toolchain (QH-5a). Every packaging job installs these from
# uv.lock instead of a floating `pip install pyinstaller` / `pip install
# cyclonedx-bom`, so the artifact is produced by the same tested versions the
# lock records and `uv lock --check` guards.
build = [
    "pyinstaller>=6.10",
    "pyinstaller-hooks-contrib>=2024.8",
    "cyclonedx-bom==7.4.0",
    "hatchling>=1.25",
]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.6",
    "coveralls>=4.0",
    "ruff>=0.4",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "bandit>=1.7",
    "safety>=3.0",
    "syrupy>=4.0",
    "hypothesis>=6.0",
]

[project.scripts]
sonoforge = "echo_personal_tool.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/echo_personal_tool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_personal_tool"]

[tool.hatch.build.targets.wheel.force-include]

[tool.hatch.build.targets.sdist]
include = ["src/echo_personal_tool", "README.md"]

[tool.coverage.run]
source = ["src/echo_personal_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring real DICOM files on disk or live Orthanc (ECHO_ORTHANC=1)",
    "interactive: manual cine segmentation diagnostics (MP4 without DICOM tags)",
    "gui: tests requiring PySide6 QApplication (CI: skip with -m 'not gui')",
    "real_webengine: GUI tests that must build a real QWebEngineView (opt out of the unit-test web stub)",
    "acceptance: end-to-end user workflow tests (mocked backends; required CI job test-acceptance)",
    "security: fuzzing, anonymisation, TLS/timeout and credential tests (mocked; required CI job test-security)",
    "regression: snapshot and golden-file regression tests",
    "migration: data migration and schema versioning tests",
    "system: black-box tests against installed application (ECHO_SYSTEM=1)",
    "compat: OS and platform compatibility tests (ECHO_COMPAT=1)",
    "bench: performance benchmarks (ECHO_BENCH=1)",
]
addopts = "-q -m 'not interactive'"
timeout = 60
timeout_method = "thread"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pytest-benchmark]
autosave = true
min_rounds = 5
calibration_precision = 100
save = "bench"
sort = "mean"
compare = "mean"
name = "ECHO2026"
group_by = "group"
timer = "time.perf_counter"

[tool.ruff]
line-length = 120
# Deliberately one step behind `requires-python`: at `py311` ruff's UP017 fires
# on the 24 `timezone.utc` sites that the 3.10 floor pinned down, and migrating
# them to `datetime.UTC` (plus `enum.StrEnum` in `measurement_action.py`) is a
# readability refactor, not a security fix. Bump this together with that pass.
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S110", "T201"]
ignore = ["E402", "E501", "UP042", "E741"]

[tool.ruff.lint.per-file-ignores]
# Tests and intentionally user-facing CLI scripts use print for their output.
"tests/**/*.py" = ["T201"]
# The packaged-artifact smoke is a CLI: its `save`/`restart`/`compare` stages are
# driven by the workflows and print a PASS/FAIL line per check (QH-5a).
"src/echo_personal_tool/application/package_smoke.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
files = [
    "src/echo_personal_tool/domain",
    "src/echo_personal_tool/imaging",
    "src/echo_personal_tool/application",
    "src/echo_personal_tool/infrastructure",
]
strict = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "onnxruntime",
    "onnxruntime.*",
    "scipy",
    "scipy.*",
    "PySide6",
    "PySide6.*",
    "pyqtgraph",
    "pyqtgraph.*",
    "pydicom",
    "pydicom.*",
    "pylibjpeg",
    "pylibjpeg.*",
    "pynetdicom",
    "pynetdicom.*",
    "httpx",
    "httpx.*",
    "psutil",
    "psutil.*",
    "reportlab",
    "reportlab.*",
    "openpyxl",
    "openpyxl.*",
    "keyring",
    "keyring.*",
    "PIL",
    "PIL.*",
    "shiboken6",
    "shiboken6.*",
]
ignore_missing_imports = true

# QH-3 extension: application/infrastructure are now checked, but allow
# incremental adoption — untyped helpers in older application plumbing are
# permitted until the next slice migrates them, while still enforcing
# attribute safety and return-type contracts.
[[tool.mypy.overrides]]
module = [
    "echo_personal_tool.keyboard_shortcuts",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "echo_personal_tool.application",
    "echo_personal_tool.application.*",
    "echo_personal_tool.infrastructure",
    "echo_personal_tool.infrastructure.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_calls = false
disable_error_code = ["misc", "attr-defined", "untyped-decorator"]

